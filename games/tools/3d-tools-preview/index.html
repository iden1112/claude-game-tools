<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 게임 도구 미리보기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#f4ecd8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:10px;top:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
#top h1{font-size:15px;margin:0;padding:6px 10px;background:rgba(10,20,30,.7);border-radius:8px;pointer-events:auto}
#stat{font-size:12px;padding:6px 8px;background:rgba(10,20,30,.7);border-radius:8px;margin-left:auto;font-variant-numeric:tabular-nums}
#panel{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(8,16,26,.92) 30%);}
.tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}
.tab{flex:none;padding:6px 12px;border-radius:999px;border:1px solid #3a5a78;background:#132a40;color:#cfe2f2;font-size:13px;font-weight:700}
.tab.on{background:#f0c040;color:#2a1a04;border-color:#f0c040}
.btns{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow-y:auto}
.btns button{flex:1 1 auto;min-width:88px;padding:9px 8px;border-radius:10px;border:none;background:#24425e;color:#fff;font-size:13px;font-weight:700}
.btns button:active{background:#3a6a90}
.btns button.loop{background:#4a3a6a}
.btns button.loop.on{background:#a070ff}
#hint{position:fixed;left:50%;top:52px;transform:translateX(-50%);font-size:12px;opacity:.8;background:rgba(10,20,30,.6);padding:4px 10px;border-radius:8px;white-space:nowrap}
#err{position:fixed;inset:auto 10px 50% 10px;padding:12px;background:#5a1a1a;border-radius:8px;font-size:13px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><h1>3D 게임 도구 미리보기</h1><div id="stat"></div></div>
<div id="hint">드래그: 회전 · 두 손가락/휠: 확대 · 아래 버튼: 이펙트</div>
<div id="err"></div>
<div id="panel">
  <div class="tabs" id="tabs"></div>
  <div class="btns" id="btns"></div>
</div>

  frames++; fpsT += dt; if (fpsT > 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; document.getElementById('stat').textContent = `${fps} FPS · 파티클 ${fx.count()}`; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__demo = { fx, scene, M, TABS };
})();
</script>
