<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>무한 드라이브</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.pill{background:rgba(10,14,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 12px;font-weight:700}
#top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#coinBox{font-size:18px;display:flex;align-items:center;gap:6px}
#coinBox .ic{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23c 45%,#c88a10);box-shadow:0 0 6px #ffd23c88}
#envLabel{font-size:12px;opacity:.95;white-space:nowrap;padding:5px 10px}
#icons{display:flex;gap:6px;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,22,.55);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ib:active{transform:scale(.93)}
.ib.active{background:linear-gradient(135deg,#2ac98c,#1a8cff);border-color:#cff}
#distBox{font-size:14px;display:flex;align-items:center;gap:4px}
#bottom{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.grp{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.cb{width:76px;height:76px;border-radius:20px;border:2px solid rgba(255,255,255,.25);background:rgba(10,14,22,.5);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
.cb small{font-size:11px;font-weight:700;opacity:.85;margin-top:2px}
.cb.on{background:rgba(255,255,255,.28);border-color:#fff;transform:scale(.95)}
#gas{height:96px;background:rgba(40,160,80,.45)}
#brake{background:rgba(190,50,50,.4)}
#drift{background:rgba(140,70,230,.45);font-size:26px}
#drift.on{background:rgba(170,100,255,.8)}
#driftTag{position:fixed;left:50%;top:26%;transform:translateX(-50%) skewX(-10deg);font-size:28px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 14px #a86cff,0 3px 8px #000a;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#camHint{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:10px}
#rightCol{display:flex;flex-direction:column;gap:10px;align-items:center}
#boost{width:78px;height:78px;border-radius:50%;--p:1;background:conic-gradient(#ff7a1a calc(var(--p)*360deg),rgba(255,255,255,.12) 0);padding:4px;border:none}
#boost .in{width:100%;height:100%;border-radius:50%;background:rgba(20,10,4,.75);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:26px}
#boost.ready .in{background:radial-gradient(circle,#ffb347,#ff5a00);box-shadow:0 0 18px #ff7a1a}
#boost .in small{font-size:11px;font-weight:800}
#fast{width:78px;height:50px;font-size:15px;font-weight:800;border-radius:16px}
#fast.active{background:linear-gradient(135deg,#2a8cff,#7a3cff);border-color:#cfe2ff;box-shadow:0 0 14px #4a8cff}
#speedo{position:absolute;left:50%;bottom:0;transform:translateX(-50%);text-align:center;pointer-events:none}
#speedo b{font-size:40px;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px #000a;display:block;line-height:1}
#speedo span{font-size:12px;opacity:.8;font-weight:700}
#hint{font-size:11px;opacity:.75;margin-top:4px}
#lines{position:fixed;inset:-30%;pointer-events:none;opacity:0;transition:opacity .25s;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg 4deg,rgba(255,240,220,.5) 4deg 4.5deg);-webkit-mask:radial-gradient(circle,transparent 30%,#000 70%);mask:radial-gradient(circle,transparent 30%,#000 70%)}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:62%;overflow:auto;background:rgba(14,18,28,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,.12);padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box;pointer-events:auto;display:none;touch-action:pan-y}
.panel.show{display:block}
.panel h3{margin:4px 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.panel h4{margin:14px 0 8px;font-size:13px;opacity:.75}
.close{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;padding:6px 12px;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip.sel{background:#fff;color:#111;border-color:#fff}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:10px;background:rgba(255,255,255,.05);cursor:pointer}
.card.prev{border-color:#7ab8ff}
.card .nm{font-weight:800;font-size:14px;margin-bottom:6px}
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin:3px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ad0ff,#ff7a1a)}
.card .lb{font-size:10px;opacity:.7}
.buy{width:100%;margin-top:6px;border:none;border-radius:10px;padding:9px;font-weight:800;font-size:13px;cursor:pointer;background:#ffd23c;color:#221}
.buy.owned{background:#3a8cff;color:#fff}
.buy.using{background:rgba(255,255,255,.15);color:#fff}
.buy.no{background:rgba(255,255,255,.1);color:#aaa}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);background:rgba(10,14,22,.85);padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,rgba(5,8,18,.35),rgba(5,8,18,.8));pointer-events:auto;text-align:center;padding:20px;box-sizing:border-box}
#start h1{font-size:clamp(34px,8vw,64px);margin:0;letter-spacing:-1px;font-style:italic;text-shadow:0 4px 30px #ff7a1a88}
#start p{opacity:.85;max-width:420px;line-height:1.5;font-size:14px}
#go{margin-top:14px;font-size:20px;font-weight:900;padding:16px 46px;border-radius:18px;border:none;background:linear-gradient(135deg,#ffb347,#ff5a00);color:#fff;cursor:pointer;box-shadow:0 8px 30px #ff5a0066}
.keys{font-size:12px;opacity:.7;margin-top:14px;line-height:1.7}
body.imm #icons .ib:not(#bFs){display:none}
body.imm #envLabel{display:none}
body.garage #bottom,body.garage #envLabel{visibility:hidden}
@media (orientation:landscape){.panel{left:auto;right:0;top:0;bottom:0;transform:none;width:min(390px,50%);max-height:none;border-radius:22px 0 0 22px;padding-top:max(16px,env(safe-area-inset-top))}}
@media (pointer:fine){.cb{width:62px;height:62px;font-size:24px}#gas{height:76px}}
@media (max-width:430px){#gas{height:72px!important}#drift{height:58px}#brake{height:58px}#icons{display:grid;grid-template-columns:repeat(3,38px);gap:5px}.ib{width:38px;height:38px;font-size:17px}#distBox{font-size:13px}.cb{width:64px;height:64px;font-size:24px}#gas{height:80px}#boost{width:66px;height:66px}#fast{width:66px;height:44px;font-size:14px}#speedo{bottom:150px}#speedo b{font-size:34px}.grp{gap:8px}}
@media (max-height:430px){.cb{width:62px;height:62px;font-size:24px}#gas{height:72px}#boost{width:64px;height:64px}#fast{width:64px;height:42px}#speedo b{font-size:30px}.ib{width:36px;height:36px;font-size:16px}}
</style>
</head>
<body>
<div id="lines"></div>
<div id="ui">
  <div id="top">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
      <div style="display:flex;gap:6px"><div id="coinBox" class="pill"><span class="ic"></span><span id="coins">0</span></div><div id="distBox" class="pill">📍 <span id="dist">0.0 km</span></div></div>
      <div id="envLabel" class="pill">봄 · 07:00</div>
    </div>
    <div id="icons">
      <button class="ib" id="bAuto" title="자동 운전 (Q)">🤖</button>
      <button class="ib" id="bEnv" title="날씨·계절·시간 (E)">🌦️</button>
      <button class="ib" id="bGarage" title="차고 (G)">🚗</button>
      <button class="ib" id="bCam" title="카메라 (C)">🎥</button>
      <button class="ib" id="bSnd" title="소리 (M)">🔊</button>
      <button class="ib" id="bFs" title="전체화면 (F)">⛶</button>
    </div>
  </div>
  <div id="bottom">
    <div class="grp">
      <button class="cb" data-k="left">◀</button>
      <button class="cb" data-k="right">▶</button>
    </div>
    <div id="speedo"><b id="spd">0</b><span>km/h</span><div id="hint"></div></div>
    <div class="grp">
      <div id="rightCol">
        <button class="cb" id="boost"><div class="in">🔥<small>부스트</small></div></button>
        <button class="cb" id="slow" data-k="slow" style="display:none">🪂<small>감속</small></button>
        <button class="cb" id="fast">빠르게</button>
      </div>
      <div id="rightCol2" style="display:flex;flex-direction:column;gap:10px">
        <button class="cb" id="gas" data-k="gas">▲<small>가속</small></button>
        <button class="cb" id="drift" data-k="drift">〰<small>드리프트</small></button>
        <button class="cb" id="brake" data-k="brake">▼<small>브레이크</small></button>
      </div>
    </div>
  </div>
</div>
<div id="envPanel" class="panel">
  <h3>날씨 · 계절 · 시간 <button class="close" data-close="envPanel">닫기</button></h3>
  <h4>계절</h4><div class="chips" id="cSeason"></div>
  <h4>날씨</h4><div class="chips" id="cWeather"></div>
  <h4>시간</h4><div class="chips" id="cTime"></div>
  <h4>시간 흐름</h4><div class="chips" id="cSpeed"></div>
  <h4>그래픽 (폰이 뜨거우면 🔋 절전)</h4><div class="chips" id="cQual"></div>
  <h4>월드</h4><div class="chips"><button class="chip" id="bNewWorld">🌍 새 월드 만들기</button></div>
</div>
<div id="garagePanel" class="panel">
  <h3><span>차고 · <span style="color:#ffd23c">🪙 <span id="gCoins">0</span></span></span><button class="close" data-close="garagePanel">닫기</button></h3>
  <div class="cars" id="carList"></div>
  <div style="font-size:12px;opacity:.6;margin-top:10px">카드를 누르면 위에서 미리 볼 수 있어요. 코인은 길 위, 들판 곳곳에 있어요. 보라색 보석은 10코인!</div>
</div>
<div id="toast"></div>

<div id="start">
  <h1>무한 드라이브</h1>
  <p>언덕과 산, 숲과 호수 사이로 끝없이 이어지는 한 줄기 길.<br>코인을 모아 새 차를 사고, 날씨·계절·시간을 바꿔 보세요.</p>
  <button id="go">시작하기</button>
  <div class="keys" id="keys"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*
 * fx3d.js v2 — 3D 게임용 이펙트 라이브러리 (Three.js r128 이상, 의존성 없음)
 *
 *   const fx = new FX3D(scene, { pixelRatioHeight: renderer.domElement.height, look: 'toon' });
 *   fx.update(dt, camera);                      // 매 프레임
 *   fx.splash(pos); fx.rarity(pos, 2); fx.explosion(pos); fx.text(pos, "+120G");
 *   const fire = fx.fire(pos);  fire.stop();     // 계속 나오는 이펙트는 핸들
 *
 * 보이는 방식(look)
 *   'toon'  : 또렷한 모양 + 단계 색 + 점 패턴(디더링)으로 사라짐. 저폴리·만화풍 게임 (기본)
 *   'pixel' : toon 과 같은데 파티클 하나하나가 작은 픽셀 그림처럼 보여요. 픽셀풍 3D 게임
 *   'soft'  : 부드럽게 번지는 일반 파티클
 *
 * 파티클은 카메라를 보는 작은 판(인스턴싱)이라 수천 개도 드로우콜 2개예요.
 * 빠르게 움직이는 파티클(물방울, 불똥)은 속도 방향으로 늘어나 꼬리가 생겨요.
 */
(function (root) {
  'use strict';
  const T = () => root.THREE;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const v3 = (p) => ({ x: p.x || 0, y: p.y || 0, z: p.z || 0 });
  const rgb = (c) => { const k = new (T().Color)(c); return [k.r, k.g, k.b]; };
  const hsl = (h, s, l) => { const k = new (T().Color)(); k.setHSL(((h % 1) + 1) % 1, s, l); return [k.r, k.g, k.b]; };
  const ease = {
    out: (t) => 1 - (1 - t) * (1 - t),
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    outBack: (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  };
  // PIXELFX 번들은 전역 var 또는 const 로 있을 수 있어요
  // eslint-disable-next-line no-undef
  const pixelfxLib = () => root.PIXELFX || (typeof PIXELFX !== 'undefined' ? PIXELFX : null);

  // ---------- 색 묶음 (어두움 → 밝음, 이펙트가 쓰는 기본 팔레트) ----------
  const RAMPS = {
    water: [0xffffff, 0xd8f4ff, 0x8fd2f4, 0x4a9ad0],
    foam: [0xffffff, 0xeaf6ff, 0xb8dcf0],
    fire: [0xfffbe0, 0xffe066, 0xffa02a, 0xe04a1a, 0x7a2a1a],
    ember: [0xffffff, 0xffe066, 0xff8a2a, 0xd03a10],
    smoke: [0x6a625a, 0x8a8278, 0xa8a096, 0xc4beb4],
    dark: [0x3a302a, 0x4a4038, 0x5a5048, 0x6a6058],
    dust: [0xe0d4b8, 0xc8b89a, 0xa8987a],
    gold: [0xffffff, 0xfff4a0, 0xffd23a, 0xe09414, 0xa05c0c],
    silver: [0xffffff, 0xeef4ff, 0xc8d4e8, 0x8a9ab8],
    bronze: [0xffe8c8, 0xf0b070, 0xc87a3a, 0x8a4a1a],
    heal: [0xffffff, 0xd0ffd8, 0x7dff9a, 0x2ab04a],
    magic: [0xffffff, 0xe0d0ff, 0xa080ff, 0x6040d0],
    leaf: [0x8fd16a, 0x5aa040, 0x3a7a2a],
    wood: [0xd8a868, 0xa87038, 0x6a4220],
  };
  const SHAPE = { circle: 0, ring: 1, star: 2, spark: 3, puff: 4, square: 5, drop: 6, heart: 7 };

  // ---------- 셰이더 ----------
  const VERT = `
    attribute vec3 iPos; attribute vec3 iVel; attribute vec4 iCol; attribute vec4 iData;
    varying vec2 vUv; varying vec4 vCol; varying float vShape;
    void main(){
      vUv = uv; vCol = iCol; vShape = iData.w;
      vec4 mv = modelViewMatrix * vec4(iPos, 1.0);
      float size = iData.x, rot = iData.y, stretch = iData.z;
      vec2 ax = vec2(cos(rot), sin(rot)); float len = size;
      if (stretch > 0.0) {
        vec2 vv = (modelViewMatrix * vec4(iVel, 0.0)).xy;
        float sp = length(vv);
        if (sp > 0.0001) { ax = vv / sp; len = size + sp * stretch; }
      }
      vec2 ay = vec2(-ax.y, ax.x);
      mv.xy += ax * position.x * len + ay * position.y * size;
      gl_Position = projectionMatrix * mv;
    }`;
  const FRAG = `
    uniform float uPix; uniform float uMode; // 0 toon(디더) 1 glow(가산) 2 soft
    varying vec2 vUv; varying vec4 vCol; varying float vShape;
    float bayer(vec2 p){ vec2 q = mod(floor(p), 4.0); float a = mod(q.x,2.0)*2.0 + mod(q.y,2.0); float b = mod(floor(q.x/2.0),2.0)*2.0 + mod(floor(q.y/2.0),2.0);
      return (a*4.0 + b + 0.5) / 16.0; }
    void main(){
      vec2 uv = vUv;
      if (uPix > 0.5) uv = (floor(uv * uPix) + 0.5) / uPix;
      vec2 p = uv * 2.0 - 1.0; float r = length(p); float m = 0.0; float shade = 1.0;
      int s = int(vShape + 0.5);
      if (s == 0) { m = step(r, 0.95); }
      else if (s == 1) { m = step(r, 0.95) * step(0.62, r); }
      else if (s == 2) { vec2 a = abs(p); m = step(a.x * a.y * 9.0 + max(a.x, a.y) * 0.55, 0.62) * step(r, 1.0); }
      else if (s == 3) { vec2 a = abs(p); m = step(a.x + a.y * 2.2, 1.0); }
      else if (s == 4) { m = step(r, 0.95); vec3 n = vec3(p, sqrt(max(0.0, 1.0 - r * r)));
        float l = dot(n, normalize(vec3(-0.55, 0.65, 0.55))); shade = l > 0.62 ? 1.12 : (l > 0.2 ? 0.92 : 0.72); }
      else if (s == 5) { m = step(max(abs(p.x), abs(p.y)), 0.9); }
      else if (s == 6) { m = step(r, 0.95); shade = (p.x < -0.2 && p.y > 0.1) ? 1.25 : 1.0; }
      else { vec2 q = p * vec2(1.0, -1.0) * 1.15 + vec2(0.0, 0.25); float a = atan(q.x, q.y) / 3.14159; float h = abs(a);
        float d = (13.0*h - 22.0*h*h + 10.0*h*h*h) / (6.0 - 5.0*h); m = step(length(q), d * 0.95); }
      if (m < 0.5) discard;
      vec3 col = vCol.rgb * shade;
      if (uMode < 0.5) {
        if (vCol.a < bayer(gl_FragCoord.xy)) discard;
        gl_FragColor = vec4(col, 1.0);
      } else if (uMode < 1.5) {
        gl_FragColor = vec4(col * vCol.a, 1.0);
      } else {
        float soft = 1.0 - smoothstep(0.2, 1.0, r);
        gl_FragColor = vec4(col, vCol.a * (s == 4 || s == 0 ? soft : 1.0));
      }
    }`;

  class Batch {
    constructor(fx, mode, max) {
      const THREE = T();
      this.max = max; this.ps = []; this.mode = mode;
      const quad = new THREE.PlaneGeometry(1, 1);
      const g = new THREE.InstancedBufferGeometry();
      g.index = quad.index; g.attributes.position = quad.attributes.position; g.attributes.uv = quad.attributes.uv;
      this.aPos = new THREE.InstancedBufferAttribute(new Float32Array(max * 3), 3);
      this.aVel = new THREE.InstancedBufferAttribute(new Float32Array(max * 3), 3);
      this.aCol = new THREE.InstancedBufferAttribute(new Float32Array(max * 4), 4);
      this.aDat = new THREE.InstancedBufferAttribute(new Float32Array(max * 4), 4);
      for (const a of [this.aPos, this.aVel, this.aCol, this.aDat]) a.setUsage && a.setUsage(THREE.DynamicDrawUsage);
      g.setAttribute('iPos', this.aPos); g.setAttribute('iVel', this.aVel); g.setAttribute('iCol', this.aCol); g.setAttribute('iData', this.aDat);
      g.instanceCount = 0;

// ================= 드리프트 =================
const SKID_MAX = 900;

iSkid.count = 0; iSkid.frustumCulled = false; scene.add(iSkid);

const wpos = new V3(), lastSkid = [new V3(1e9, 0, 0), new V3(1e9, 0, 0)];

}

let coinsChanged = false, saveT = 0;

      const p = { x: k.x, y: k.y + 1.2, z: k.z };

// ================= 카메라 =================
let camHeading = 0, camY = null;

    camPos.y = Math.max(car.y + 2.8, groundH(camPos.x, camPos.z) + 1.5);
    camera.position.copy(camPos); camera.lookAt(car.x, car.y + 0.8, car.z);

// ---- 화면 돌리기 (끌기 / 두 손가락 확대 / 휠) ----
const orbit = { yaw: 0, pitch: 0, zoom: 1, drag: false, idle: 9 };
function resetOrbit() { orbit.yaw = 0; orbit.pitch = 0; orbit.zoom = 1; }
{
  const cv = renderer.domElement, ptrs = new Map();
  let pinch0 = 0, zoom0 = 1, lastTap = 0;
  cv.addEventListener('pointerdown', (e) => {
    if (!started) return;

    if (ptrs.size === 2) { const [p, q] = [...ptrs.values()]; pinch0 = Math.hypot(p.x - q.x, p.y - q.y) || 1; zoom0 = orbit.zoom; }
    const now = performance.now(); if (ptrs.size === 1 && now - lastTap < 280) { resetOrbit(); toast('카메라 원래대로'); } lastTap = now;
  });

  cv.addEventListener('wheel', (e) => { e.preventDefault(); orbit.zoom = clamp(orbit.zoom * Math.exp(e.deltaY * 0.0012), 0.45, 2.6); orbit.idle = 0; }, { passive: false });
}

{ const s = road[240]; car.ri = 240; car.x = s.x - s.fz * 1.8; car.z = s.z + s.fx * 1.8; car.heading = car.velAng = Math.atan2(s.fx, s.fz); car.y = s.y; }
