<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>픽셀 피싱 빌리지</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#3b2414;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
button{font-family:inherit;cursor:pointer}
.pbox{background:#f6e3b4;border:3px solid #5b3a1e;box-shadow:inset 0 0 0 2px #e6c27e,0 3px 0 #2a180b;border-radius:6px}
.hidden{display:none!important}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));padding:5px 10px;font-weight:800;font-size:13px;line-height:1.45;z-index:5;min-width:132px}
#hud .gold{color:#8a5a00}
#hud .row{display:flex;justify-content:space-between;gap:10px}
#topbtns{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.ib{width:44px;height:44px;font-size:19px;padding:0;display:flex;align-items:center;justify-content:center;color:#3b2414;font-weight:800}
.ib small{font-size:9px;display:block}
#hotbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:5}
.hs{width:48px;height:48px;position:relative;background:#e9c98c;border:2px solid #8a5a2b;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0}
.hs.sel{outline:3px solid #ff4d2e;outline-offset:-1px;background:#ffe2a8}
.hs img,.slot img{image-rendering:pixelated;width:34px;height:34px;pointer-events:none}
.hs .k{position:absolute;top:0;left:3px;font-size:10px;font-weight:800;color:#6b4220}
.hs .n,.slot .n{position:absolute;bottom:0;right:3px;font-size:11px;font-weight:900;color:#2a180b;text-shadow:0 0 2px #fff,0 0 2px #fff}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(84px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.35);z-index:6;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:rgba(255,240,210,.85);border:3px solid #5b3a1e}
#abtn{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;font-size:17px;font-weight:900;z-index:6;background:#ffcf5a;border:4px solid #5b3a1e;box-shadow:0 4px 0 #2a180b;color:#3b2414;touch-action:none}
#abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a180b}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));transition:opacity .2s;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:30;pointer-events:none;width:92vw}
.toast{padding:6px 12px;font-size:13px;font-weight:800;animation:tin .25s ease-out;text-align:center;max-width:100%}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#chatlog{position:fixed;left:calc(8px + env(safe-area-inset-left));top:calc(92px + env(safe-area-inset-top));width:min(300px,60vw);z-index:4;pointer-events:none;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
#chatlog div{margin:2px 0;opacity:.95;word-break:break-all}
#chatbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;z-index:25;width:min(420px,94vw)}
#chatbox input{flex:1;font-size:16px;padding:6px;border:2px solid #8a5a2b;border-radius:4px;background:#fff8e6;user-select:text;-webkit-user-select:text}
#chatbox button{padding:6px 10px;font-weight:800;background:#ffcf5a;border:2px solid #5b3a1e;border-radius:4px}
#dialog{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,96vw);padding:10px 12px;z-index:20;font-size:15px;display:flex;gap:10px;align-items:stretch}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dmain p{flex:1;min-height:3em}
#dport{flex:none;width:clamp(96px,22vw,150px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;background:#e8c98a;border:3px solid #8a5a2b;border-radius:5px;box-shadow:inset 0 0 0 2px #f4dca8}
#dpc{width:100%;aspect-ratio:1;image-rendering:pixelated;background:radial-gradient(circle at 50% 40%,#ffe9b8,#d9b06a);border:2px solid #5b3a1e;border-radius:3px}
#dpname{font-weight:900;font-size:13px;color:#5b2a0a;text-align:center;line-height:1.1}
.touch #dialog{bottom:calc(214px + env(safe-area-inset-bottom))}
#dialog b{display:block;color:#8a3a10;margin-bottom:3px}
#dialog p{margin:0;line-height:1.5;font-weight:600}
#dialog .btns{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.btn{padding:7px 14px;font-weight:800;font-size:14px;background:#ffcf5a;border:2px solid #5b3a1e;border-radius:5px;box-shadow:0 2px 0 #2a180b;color:#3b2414}
.btn:disabled{background:#cbb68f;color:#7d6a50;box-shadow:none;cursor:default}
.btn.g{background:#9be07a}.btn.r{background:#ff9a7a}.btn.s{padding:4px 9px;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(10,6,2,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:10px}
.panel{width:min(620px,96vw);max-height:88vh;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:3px solid #c9995a;font-weight:900;font-size:17px}
.ph button{width:34px;height:34px;font-size:16px;font-weight:900;background:#ff9a7a;border:2px solid #5b3a1e;border-radius:5px}
#mbody{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:6px 10px;font-weight:800;font-size:13px;background:#e3c48a;border:2px solid #8a5a2b;border-radius:5px;color:#3b2414}
.tab.on{background:#ffcf5a;border-color:#5b3a1e}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
@media (min-width:560px){.grid{grid-template-columns:repeat(10,1fr)}}
.slot{aspect-ratio:1;position:relative;background:#e9c98c;border:2px solid #8a5a2b;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0}
.slot.lock{background:#b9a27a;opacity:.45}
.slot.sel{outline:3px solid #ff4d2e;outline-offset:-1px}
.slot img{width:70%;height:70%}
.star{font-weight:900;text-shadow:0 0 1px #000,0 0 1px #000}
.slot .star{position:absolute;top:-1px;left:2px;font-size:12px}
.g0{color:#d08a4a}.g1{color:#e4e8f0}.g2{color:#ffd23a}
.g3{background:linear-gradient(90deg,#ff4d4d,#ffb84d,#fff04d,#5dff6a,#4dc3ff,#b44dff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 1px #000)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fbefcf;border:2px solid #d2a868;border-radius:5px}
.li img{width:34px;height:34px;image-rendering:pixelated;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px}
.li .t span{font-size:12px;color:#6b4a2a}
.sec{font-weight:900;margin:10px 0 6px;font-size:14px;color:#7a3a10}
.eq{display:flex;gap:8px;flex-wrap:wrap}
.eqb{flex:1;min-width:150px;padding:6px 8px;background:#fbefcf;border:2px solid #d2a868;border-radius:5px;font-size:13px}
.eqb select{width:100%;font-size:14px;padding:3px;margin-top:3px;background:#fff8e6;border:2px solid #8a5a2b;border-radius:4px}
#detail{margin-top:8px;min-height:44px}
#mapcv{width:100%;image-rendering:pixelated;border:3px solid #5b3a1e;border-radius:4px;display:block;background:#000}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-top:6px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px;border:1px solid #000}
#catchpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:35;padding:14px 22px;text-align:center;min-width:240px;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#catchpop img{width:96px;height:96px;image-rendering:pixelated}
#catchpop h3{margin:2px 0;font-size:20px}
#catchpop .bigstar{font-size:30px;letter-spacing:2px}
#start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:linear-gradient(#4aa3df 0%,#8fd0f0 55%,#f2dc9a 55%,#e8c97a 62%,#2a64b5 62%,#1d4f95 100%);padding:12px;overflow:auto;touch-action:pan-y}
#start .card{width:min(440px,96vw);padding:16px;text-align:center}
#start h1{margin:0 0 4px;font-size:30px;color:#ffcf5a;text-shadow:3px 3px 0 #5b3a1e,-1px -1px 0 #5b3a1e,1px -1px 0 #5b3a1e,-1px 1px 0 #5b3a1e;letter-spacing:1px}
#start .sub{font-weight:700;font-size:13px;margin-bottom:12px}
#start label{display:block;text-align:left;font-weight:800;font-size:13px;margin:8px 0 4px}
#start input{width:100%;font-size:16px;padding:8px;border:2px solid #8a5a2b;border-radius:5px;background:#fff8e6;user-select:text;-webkit-user-select:text}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:6px;border:3px solid #5b3a1e}
.colors button.on{outline:3px solid #ff4d2e}
#start .modes{display:flex;gap:8px;margin-top:14px}
#start .modes .btn{flex:1;padding:12px 6px;font-size:16px}
#start .help{font-size:12px;text-align:left;margin-top:12px;line-height:1.6;background:#fbefcf;border:2px solid #d2a868;border-radius:5px;padding:8px}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:4;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;white-space:nowrap}
.touch #tip{bottom:calc(196px + env(safe-area-inset-bottom))}
#online{font-size:11px;font-weight:800;color:#2a7a20}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="pbox hidden">
  <div class="row"><span id="hDate">봄 1일</span><span id="hWeather">☀️</span></div>
  <div class="row"><span id="hTime">06:00</span><span class="gold" id="hGold">500G</span></div>
  <div id="online"></div>
</div>
<div id="topbtns" class="hidden">
  <button class="ib pbox" id="bInv" title="가방 (I)">🎒</button>
  <button class="ib pbox" id="bMap" title="지도 (M)">🗺️</button>
  <button class="ib pbox" id="bDex" title="도감 (B)">📖</button>
  <button class="ib pbox hidden" id="bChat" title="채팅 (T)">💬</button>
  <button class="ib pbox" id="bFull" title="전체화면 (F)">⛶</button>
  <button class="ib pbox" id="bMenu" title="메뉴">⚙️</button>
</div>
<div id="hotbar" class="pbox hidden"></div>
<div id="tip"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<button id="abtn" class="hidden">사용</button>
<div id="toasts"></div>
<div id="chatlog"></div>
<div id="chatbox" class="pbox hidden"><input id="chatin" maxlength="80" placeholder="메시지 입력..."><button id="chatsend">보내기</button></div>
<div id="dialog" class="pbox hidden"><div class="dmain"><b id="dname"></b><p id="dtext"></p><div class="btns" id="dbtns"></div></div><div id="dport"><canvas id="dpc" width="52" height="52"></canvas><span id="dpname"></span></div></div>
<div id="modal" class="hidden"><div class="panel pbox"><div class="ph"><span id="mtitle"></span><button id="mclose">✕</button></div><div id="mbody"></div></div></div>
<div id="catchpop" class="pbox hidden"></div>
<div id="start">
  <div class="card pbox">
    <h1>픽셀 피싱 빌리지</h1>
    <div class="sub">바다·강·호수에서 낚시하고, 농사짓고, 마을 사람들과 어울려요</div>
    <label for="nameIn">이름</label>
    <input id="nameIn" maxlength="10" placeholder="낚시꾼">
    <canvas id="preview" width="150" height="56" style="width:300px;height:112px;image-rendering:pixelated;display:block;margin:6px auto 0"></canvas>
    <label>머리 모양</label>
    <div class="colors" id="hstyles"></div>
    <label>머리 색</label>
    <div class="colors" id="hcolors"></div>
    <label>옷 색깔</label>
    <div class="colors" id="colors"></div>
    <div class="modes">
      <button class="btn g" id="bSingle">🎣 싱글플레이</button>
      <button class="btn" id="bMulti">👥 멀티플레이</button>
    </div>
    <button class="btn" id="bFull2" style="margin-top:8px;width:100%">⛶ 전체화면으로 하기</button>
    <div id="saveInfo" style="font-size:12px;margin-top:8px;font-weight:700"></div>
    <div class="help">
      <b>PC</b> 이동 WASD/방향키 · 사용 Space/E/클릭 · 도구 1~5 · 가방 I · 지도 M · 도감 B · 채팅 T · 전체화면 F<br>
      <b>모바일</b> 왼쪽 조이스틱으로 이동 · 사용 버튼 · 아래 도구 칸을 눌러 선택<br>
      <b>낚시</b> 물을 보고 낚싯대 사용 → <b>!</b> 뜨면 사용 → 바늘이 초록 구역에 있을 때 4번 누르기<br>
      <b>시간</b> 하루 = 실제 20분 · 한 계절 = 30일 · 멀티플레이는 모두 같은 시간·날씨를 공유해요
    </div>
  </div>
</div>

function bindShop() {
  $('#mbody').onclick = e => {
    const t = e.target.closest('button'); if (!t || t.disabled) return;
    if (t.dataset.tab) { shopTab = +t.dataset.tab; renderModal(); return; }

      const [kind, id, q] = t.dataset.buy.split(':');
      if (kind === 'rod') { const r = ROD_BY[id]; if (S.gold >= r.price) { S.gold -= r.price; S.rods.push(id); S.rod = id; toast(`${r.n} 구입! 바로 장착했어요`); sfx('buy'); } }
      if (kind === 'float') { const f = FLOAT_BY[id]; if (S.gold >= f.price) { S.gold -= f.price; S.floats.push(id); S.float = id; toast(`${f.n} 구입! 바로 장착했어요`); sfx('buy'); } }

      if (kind === 'item') {
        const n = +q, cost = ITEMS[id].buy * n;
        if (S.gold >= cost) {
          if (!canAdd(id)) { toast('가방에 자리가 없어요'); return; }
          const left = addItem(id, n); const got = n - left;
          S.gold -= ITEMS[id].buy * got; sfx('buy');
          toast(`${ITEMS[id].n} ${got}개 구입${left ? ' (가방 부족)' : ''}`);
          if (ITEMS[id].type === 'bait' && (!S.bait || !invCount(S.bait))) S.bait = id;
          if (ITEMS[id].type === 'seed' && (!S.seed || !invCount(S.seed))) S.seed = id;
        }
      }
      invChanged(); renderModal(); return;
    }
    if (t.dataset.sell) {
      const [i, q] = t.dataset.sell.split(':'); const it = S.inv[+i]; if (!it) return;
      const n = q === 'all' ? it.q : 1; S.gold += itemPrice(it) * n; it.q -= n; if (it.q <= 0) S.inv[+i] = null;
      sfx('coin'); invChanged(); renderModal(); return;
    }
    if (t.dataset.sellall) {
      let sum = 0;
      S.inv.forEach((it, i) => { if (it && ITEMS[it.id].type === t.dataset.sellall) { sum += itemPrice(it) * it.q; S.inv[i] = null; } });
      S.gold += sum; sfx('coin'); toast(`${fmtG(sum)}을 벌었어요! 💰`); invChanged(); renderModal();
    }
  };
}

function drawMap() {
  const c = $('#mapcv'), k = 4; c.width = W * k; c.height = H * k;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  const season = seasonOf(worldClock().day);
  const COL = { [G.GRASS]: PAL[season].g[0], [G.FLOWER]: PAL[season].g[0], [G.PATH]: PAL[season].path[0], [G.SAND]: '#ecd9a0', [G.SEA]: '#2a64b5', [G.RIVER]: '#3a8bd8', [G.LAKE]: '#2f78b8', [G.BRIDGE]: '#a8743f', [G.PIER]: '#a8743f', [G.FARM]: '#a57d4c', [G.STONE]: '#b8b3a8', [G.FENCE]: '#7a4a22' };
  for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
    const i = idx(tx, ty); x.fillStyle = COL[ground[i]];
    x.fillRect(tx * k, ty * k, k, k);
    if (S.soil[i]) { x.fillStyle = S.soil[i].c ? '#4aa040' : '#5a3418'; x.fillRect(tx * k, ty * k, k, k); }
    if (treeBase[i] && !S.chopped[i]) { x.fillStyle = season === 3 ? '#7a8a7a' : treeBase[i] === 2 ? '#1f4f2a' : '#2f6a28'; x.fillRect(tx * k, ty * k, k, k); }
  }
  for (const b of BUILDINGS) { x.fillStyle = b.roof; x.fillRect(b.x * k, b.y * k, b.w * k, b.h * k); x.fillStyle = '#3a2210'; x.fillRect(b.door * k, (b.y + b.h - 1) * k, k, k); }
  x.fillStyle = '#9fd6ff'; x.fillRect(FOUNTAIN.x * k, FOUNTAIN.y * k, 2 * k, 2 * k);
  x.font = '700 9px system-ui,sans-serif'; x.textAlign = 'center';
  for (const l of LABELS) { x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.7)'; x.strokeText(l.n, l.x * k, l.y * k); x.fillStyle = '#fff'; x.fillText(l.n, l.x * k, l.y * k); }
  const dot = (wx, wy, col, r) => { x.fillStyle = '#000'; x.beginPath(); x.arc(wx / TS * k, wy / TS * k, r + 1.5, 0, 7); x.fill(); x.fillStyle = col; x.beginPath(); x.arc(wx / TS * k, wy / TS * k, r, 0, 7); x.fill(); };
  for (const n of npcs) if (!n.hidden) dot(n.x, n.y, '#ffd23a', 2.5);
  for (const [, o] of peersMap) dot(o.x, o.y, '#30c0ff', 3);
  dot(P.x, P.y, '#ff3030', 4);
}

  normalizeInv();
  P.x = S.px; P.y = S.py;
  if (boxBlocked(P.x, P.y)) { P.x = 10.5 * TS; P.y = 11.6 * TS; }
  catchUpDays();
  $('#start').classList.add('hidden');
  ['#hud', '#topbtns', '#hotbar'].forEach(s => $(s).classList.remove('hidden'));
  if (isTouch) { document.body.classList.add('touch'); $('#joy').classList.remove('hidden'); $('#abtn').classList.remove('hidden'); }
  buildHotbar(); updateHUD();
  started = true; last = performance.now();
  const { day } = worldClock();
  toast(`${SEASON_EMO[seasonOf(day)]} ${yearOf(day)}년차 ${SEASONS[seasonOf(day)]} ${day % 30 + 1}일 · ${WEATHER_TXT[weatherOf(day)]}`);
  if (!sv) { toast('환영해요! 강가에서 낚싯대를 써 보세요 🎣'); }
  if (mode === 'multi') startNet();
}
</script>
</body>
