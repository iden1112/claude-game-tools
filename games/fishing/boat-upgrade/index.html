<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const wrap=document.getElementById('wrap');
if(!window.THREE){document.getElementById('meta').textContent='3D 엔진을 불러오지 못했어요.';return;}
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));wrap.prepend(r.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1526);scene.fog=new THREE.Fog(0x0c1526,45,110);
scene.add(new THREE.HemisphereLight(0xffe4cc,0x1a2a40,.95));
const sun=new THREE.DirectionalLight(0xffc49a,1.0);sun.position.set(8,12,6);scene.add(sun);
const rim=new THREE.DirectionalLight(0x8ad0ff,.5);rim.position.set(-6,4,-8);scene.add(rim);
const S={engine:0,finder:true,boat:true,boxLv:0};
const boat=new THREE.Group();boat.rotation.order='YXZ';scene.add(boat);
const LAMC={};const lam=c=>LAMC[c]||(LAMC[c]=new THREE.MeshLambertMaterial({color:c,flatShading:true}));

const mWood=lam(0x8a5f3c),mWhite=lam(0xe9e3d6),mRed=lam(0xb8433a),mDark=lam(0x1d2a3d),mTrunk=lam(0x6b4a30),mRock=lam(0x5a5560),mIce=lam(0xdff2fb);

const GLOWC={};const glowBasic=c=>GLOWC[c]||(GLOWC[c]=new THREE.MeshBasicMaterial({color:c}));

const unitBox=new THREE.BoxGeometry(1,1,1);

function addBox(parent,mat,w,h,d,x,y,z,ry){const m=new THREE.Mesh(unitBox,mat);m.scale.set(w,h,d);m.position.set(x,y,z);if(ry)m.rotation.y=ry;parent.add(m);return m;}

const ENGINES=[
 {name:'소형 낚싯배',sp:13,ring:1,hull:0xe9e3d6,stripe:0xb8433a},
 {name:'중형 어선',sp:20,price:6000,ring:2,hull:0xf2f2ee,stripe:0x2f6d82},
 {name:'원양 어선',sp:28,price:18000,ring:3,hull:0x1f3a5a,stripe:0xf6efe4},
 {name:'강철 탐사선',sp:36,price:45000,ring:4,hull:0x6a7480,stripe:0xe8702a},
 {name:'황금 요트',sp:46,price:120000,ring:5,hull:0xf8f2e0,stripe:0xe8b830},
];

let onBoat=false;

let outTips=[],boatModel=null,flag=null,engineBox=null,finderDish=null,boatLight=null,radar=null,boatTier=-1;
var boatMoorReady=false;
// 배 단계마다 크기와 생김새가 달라요. BD = 갑판 위치·배 크기 (캐릭터 위치, 충돌, 정박에 써요)
const BD={crate:{x:0,z:3},x:.3,y:.82,z:-.6,len:7,hw:1.4,bow:.28,walls:[],helm:{x:0,z:1.8},cabinTop:2};
let driving=false;const bp={x:.3,z:-.6};
function deckOK(x,z){const L=BD.len,hw=BD.hw*.84,bowL=L*BD.bow;if(z<-L/2+.5||z>L/2-.4)return false;
  let lim=hw;const bz=-L/2+bowL;if(z<bz)lim=hw*Math.max(0,(z+L/2)/bowL)*.9;if(Math.abs(x)>lim)return false;
  for(const r of BD.walls)if(x>r.x0-.25&&x<r.x1+.25&&z>r.z0-.25&&z<r.z1+.25)return false;return true;}
const BOAT_DIM=[{L:7,W:2.8,H:1.1},{L:9.5,W:3.5,H:1.45},{L:12,W:4.3,H:1.8},{L:15,W:4.9,H:2.05},{L:18,W:5.4,H:2.25}];
function hullShape(L,W,bow,stern){const sh=new THREE.Shape(),hw=W/2,sw=hw*(stern||.92);
  sh.moveTo(-sw,-L/2);sh.lineTo(sw,-L/2);sh.quadraticCurveTo(hw,-L/2,hw,-L/2+L*.12);sh.lineTo(hw,L/2-L*bow);
  sh.quadraticCurveTo(hw*.95,L/2-L*bow*.25,0,L/2);sh.quadraticCurveTo(-hw*.95,L/2-L*bow*.25,-hw,L/2-L*bow);
  sh.lineTo(-hw,-L/2+L*.12);sh.quadraticCurveTo(-hw,-L/2,-sw,-L/2);return sh;}
function extrudeY(shape,depth,mat,y,bevel){const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:!!bevel,bevelThickness:bevel||0,bevelSize:bevel||0,bevelSegments:2,curveSegments:12});
  g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,mat);m.position.y=y;return m;}
function buildBoatModel(){
  if(boatTier===S.engine*10+S.boxLv)return;boatTier=S.engine*10+S.boxLv;
  if(boatModel)boat.remove(boatModel);
  const t=S.engine,E=ENGINES[t],D=BOAT_DIM[t],m=new THREE.Group();boat.add(m);boatModel=m;
  const ph2=(c,o={})=>new THREE.MeshPhongMaterial(Object.assign({color:c,shininess:70,specular:0x777777,flatShading:true},o));
  const hullM=ph2(E.hull,{shininess:t>=3?110:70}),stripeM=ph2(E.stripe),deckM=lam(t>=4?0xc89a6a:0x8a5f3c),darkM=ph2(0x1d2a3d),glassM=ph2(0x1a2a3a,{shininess:140,specular:0xaaccff}),
        goldM=ph2(0xe8b830,{shininess:140,specular:0xffffff,emissive:0x3a2a00}),whiteM=ph2(0xf2f2ee);
  const bow=[.28,.3,.32,.36,.4][t],L=D.L,W=D.W,H=D.H,bottom=-H*.55,top=bottom+H;

  m.add(extrudeY(hullShape(L,W,bow),H,hullM,bottom,.08));
  const st=extrudeY(hullShape(L*1.004,W*1.02,bow),H*.14,t>=4?goldM:stripeM,bottom+H*.18);m.add(st);
  if(t>=2){const st2=extrudeY(hullShape(L*1.003,W*1.015,bow),H*.06,t>=4?goldM:stripeM,top-H*.18);m.add(st2);}
  m.add(extrudeY(hullShape(L*.94,W*.9,bow),.1,deckM,top));
  if(t>=4){const band=extrudeY(hullShape(L*.7,W*1.021,bow*1.3),H*.16,glassM,bottom+H*.48);band.position.z=L*.06;m.add(band);}
  // 난간 (선체 윤곽을 따라)
  const pts=hullShape(L*.95,W*.93,bow).getSpacedPoints(44),railM=t>=4?goldM:t>=3?ph2(0xc8ccd2):whiteM;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(a.y<-L*.46&&b.y<-L*.46)continue;
    const mx=(a.x+b.x)/2,mz=-(a.y+b.y)/2,len=Math.hypot(b.x-a.x,b.y-a.y);
    const r=new THREE.Mesh(unitBox,railM);r.scale.set(.06,.06,len);r.position.set(mx,top+.62,mz);r.rotation.y=Math.atan2(b.x-a.x,-(b.y-a.y));m.add(r);
    if(i%2===0){const po=new THREE.Mesh(unitBox,railM);po.scale.set(.05,.6,.05);po.position.set(a.x,top+.32,-a.y);m.add(po);}}
  const box=(mat,w,h,d,x,y,z,ry)=>{const b=new THREE.Mesh(unitBox,mat);b.scale.set(w,h,d);b.position.set(x,y,z);if(ry)b.rotation.y=ry;m.add(b);return b;};
  const zS=L*.5; // 선미(+z) 쪽 기준
  BD.walls=[];const wall=(mat,w,h,d,x,y,z)=>{box(mat,w,h,d,x,y,z);BD.walls.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});};
  const wheel=(x,y,z)=>{const wh=new THREE.Mesh(new THREE.TorusGeometry(.32,.04,6,18),ph2(0x6a4228));wh.position.set(x,y,z);wh.rotation.x=-.35;m.add(wh);
    for(let q=0;q<4;q++){const sp=new THREE.Mesh(unitBox,ph2(0x6a4228));sp.scale.set(.6,.04,.04);sp.position.set(x,y,z);sp.rotation.set(-.35,0,q*Math.PI/4);m.add(sp);}
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.12,8),goldM);hub.rotation.x=Math.PI/2-.35;hub.position.set(x,y,z);m.add(hub);};
  if(t===0){ // 소형: 작은 조타 콘솔(운전대), 선외기, 벤치
    wall(whiteM,1.3,1.0,1.1,0,top+.5,L*.18);box(glassM,1.1,.45,.05,0,top+1.0,L*.18-.58);box(stripeM,1.4,.1,1.2,0,top+1.05,L*.18);
    wheel(0,top+1.15,L*.18+.62);BD.helm={x:0,z:L*.18+1.15};
    wall(deckM,W*.7,.35,.5,0,top+.18,-L*.18);
    box(darkM,.6,.9,.5,0,top+.1,zS+.15);box(darkM,.2,.8,.2,0,top-.6,zS+.25);
  }
  if(t>=1){ // 조타실: 1층은 들어갈 수 있는 방(앞쪽 문, 안에 운전대), 위층은 장식
    const floors=t===1?2:t===2?2:3,w=W*.6,dz=L*.15,z0=L*(t===3?.05:.12),FH=2.25,th=.14;
    const wallM=whiteM,trimM=t>=4?goldM:ph2(E.stripe),dw=.95,pw=(w-dw)/2;
    [-1,1].forEach(k=>wall(wallM,th,FH,dz*2,k*w/2,top+FH/2,z0));             // 옆벽
    [-1,1].forEach(side=>{const z=z0+side*dz;                                 // 앞벽·뒷벽 (둘 다 가운데가 문)
      [-1,1].forEach(k=>wall(wallM,pw,FH,th,k*(dw/2+pw/2),top+FH/2,z));
      box(wallM,dw,FH-2.0,th,0,top+2.0+(FH-2.0)/2,z);
      box(trimM,dw+.16,.1,th+.06,0,top+2.02,z);[-1,1].forEach(k=>box(trimM,.08,2.0,th+.06,k*(dw/2+.04),top+1.0,z));
      const door=new THREE.Mesh(unitBox,ph2(0x8a5f3c));door.scale.set(dw*.95,1.95,.06);door.position.set(-dw/2+.05,top+.98,z+side*dw*.47);door.rotation.y=Math.PI/2;m.add(door);
      [-1,1].forEach(k=>box(glassM,pw*.65,.55,.05,k*(dw/2+pw/2),top+1.5,z+side*.09));});
    [-1,1].forEach(k=>box(glassM,.05,.55,dz*1.3,k*(w/2+.09),top+1.5,z0));
    // 안쪽: 오른쪽 앞 구석에 계기판 + 운전대 (가운데 통로는 앞문↔뒷문)
    const hx=w/2-.38;
    box(darkM,.5,1.0,.4,hx,top+.5,z0-dz+.32);
    box(new THREE.MeshBasicMaterial({color:t>=3?0x40e0ff:0x60ff80}),.36,.2,.02,hx,top+1.02,z0-dz+.53);
    wheel(hx,top+1.2,z0-dz+.66);BD.helm={x:hx-.05,z:z0-dz+1.05};
    BD.walls.push({x0:hx-.25,x1:hx+.25,z0:z0-dz+.12,z1:z0-dz+.52});
    // 바닥 장판 + 1층 지붕
    box(lam(0x6a4a30),w-.2,.04,dz*2-.2,0,top+.07,z0);
    box(trimM,w+.2,.16,dz*2+.2,0,top+FH+.08,z0);
    // 위층 (장식)
    for(let f=1;f<floors;f++){const k=1-f*.16,fh=1.15,y=top+FH+.16+(f-1)*fh+fh/2,zz=z0+f*.2;
      if(t>=4){const sh=hullShape(dz*2*k,w*k*1.05,.45,.95);const lvl=extrudeY(sh,fh*.92,whiteM,y-fh/2,.05);lvl.position.z=zz;m.add(lvl);
        const win=extrudeY(hullShape(dz*2*k*1.01,w*k*1.07,.45,.95),fh*.35,glassM,y-fh/2+fh*.38);win.position.z=zz;m.add(win);}
      else{box(f%2&&t>=2?ph2(E.stripe):whiteM,w*k,fh,dz*2*k,0,y,zz);box(glassM,w*k*.92,fh*.4,.05,0,y+.1,zz-dz*k-.01);
        [-1,1].forEach(sd=>box(glassM,.05,fh*.4,dz*1.6*k,sd*(w*k/2+.01),y+.1,zz));}
      if(f===floors-1)box(trimM,w*k*1.05,.14,dz*2.1*k,0,y+fh/2+.07,zz);}
    BD.cabinTop=top+FH+.16+(floors-1)*1.15;BD.startZ=z0-dz-1.0;
  }
  if(t===1){[-1,1].forEach(x=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.32,.08,6,14),lam(0xe8702a));r.position.set(x*(W/2+.02),top+.35,L*.05);r.rotation.y=Math.PI/2;m.add(r);});
    const cr=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.4,6),lam(0xf2b632));cr.position.set(.9,top+1.1,zS-1.2);cr.rotation.x=-.5;m.add(cr);}
  if(t===2){ // 원양 어선: 높아진 뱃머리, 아웃리거, 그물 드럼, 선미 A자 크레인
    const fc=extrudeY(hullShape(L*.3,W*.9,.9,.9),.6,hullM,top);fc.position.z=-L*.33;m.add(fc);BD.walls.push({x0:-W*.45,x1:W*.45,z0:-L*.48,z1:-L*.2});
    const drum=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,W*.6,14),ph2(0x3a8a4a));drum.rotation.z=Math.PI/2;drum.position.set(0,top+.6,zS-1.25);m.add(drum);BD.walls.push({x0:-W*.3,x1:W*.3,z0:zS-1.85,z1:zS-.65});
    [-1,1].forEach(k=>{const leg=new THREE.Mesh(unitBox,lam(0xf2b632));leg.scale.set(.18,3.4,.18);leg.position.set(k*W*.38,top+1.6,zS-.5);leg.rotation.x=.25;m.add(leg);});
    box(lam(0xf2b632),W*.8,.2,.2,0,top+3.25,zS-.05);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(.5,12,8,0,Math.PI*2,0,Math.PI/2),whiteM);dome.position.set(-.7,top+2.7,L*.1);m.add(dome);}
  if(t===3){ // 강철 탐사선: 격자 돛대, 회전 레이더, 탐조등, 구명정, 선미 헬기 착륙장, 주황 아웃리거 낚시대, 선외기 모터 2개
    const mast=new THREE.Mesh(new THREE.CylinderGeometry(.08,.14,4.5,6),ph2(0xc8ccd2));mast.position.set(0,top+6,L*.08);m.add(mast);
    for(let q=0;q<4;q++)box(ph2(0xc8ccd2),1.2-q*.2,.06,.06,0,top+3.6+q*.9,L*.08);
    radar=new THREE.Mesh(unitBox,darkM);radar.scale.set(2.2,.12,.28);radar.position.set(0,top+8.3,L*.08);m.add(radar);
    [-1,1].forEach(k=>{const sl=new THREE.Mesh(new THREE.CylinderGeometry(.2,.28,.4,10),glowBasic(0xfff4c0));sl.rotation.x=Math.PI/2;sl.position.set(k*1.2,top+3.6,-L*.05);m.add(sl);
      const lb=new THREE.Mesh(THREE.CapsuleGeometry?new THREE.CapsuleGeometry(.45,1.8,4,8):new THREE.CylinderGeometry(.45,.45,2.6,10),lam(0xe8702a));lb.rotation.x=Math.PI/2;lb.position.set(k*(W/2-.2),top+1.6,L*.3);m.add(lb);
      const nl=new THREE.Mesh(new THREE.SphereGeometry(.12,6,4),glowBasic(k<0?0xff3030:0x30ff60));nl.position.set(k*W*.45,top+.8,-L*.35);m.add(nl);});

    const arch=new THREE.Mesh(new THREE.TorusGeometry(1.6,.14,8,20,Math.PI),goldM);arch.position.set(0,BD.cabinTop+.2,L*.15);m.add(arch);
    radar=new THREE.Mesh(unitBox,whiteM);radar.scale.set(1.6,.1,.3);radar.position.set(0,BD.cabinTop+1.9,L*.15);m.add(radar);
    box(deckM,W*.85,.12,1.4,0,bottom+H*.35,zS+.6);
    for(let i=0;i<14;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.08,6,4),glowBasic(0xffe080));const sd=i%2?1:-1;l.position.set(sd*W*.46,top+.7,-L*.38+Math.floor(i/2)*L*.11);m.add(l);}
    const orn=new THREE.Mesh(new THREE.ConeGeometry(.24,1.1,6),goldM);orn.position.set(0,top+.2,-L/2-.3);orn.rotation.x=-Math.PI/2;m.add(orn);
    const jet=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,.5,12),glowBasic(0x7ad8ff));jet.position.set(0,top+.35,-L*.3);m.add(jet);}
  outTips=[];
  if(t>=2){const pl=4+t*.8,poleM=t>=4?goldM:t===3?lam(0xe8702a):lam(0xdfe3ea);[-1,1].forEach(k=>{
    box(darkM,.3,.7,.3,k*W*.45,top+.35,L*.02); // 낚시대 받침
    const pv=new THREE.Group();pv.position.set(k*W*.45,top+.7,L*.02);pv.rotation.z=k*-.95;m.add(pv);

    const reel=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.14,12),t>=4?whiteM:darkM);reel.rotation.z=Math.PI/2;reel.position.set(0,.6,.14);pv.add(reel);

  { // 배 어창 상자
    const cs=1+S.boxLv*.15,cx=t===0?-.75:-(W*.25+.2),cz=t===0?.2:BD.startZ-.2,bw=1.0*cs,bd=.75*cs,bh=.6*cs;
    const crM=ph2(0x3f86c4),lidM=ph2(0xf6efe4);
    box(crM,bw,bh,bd,cx,top+bh/2+.05,cz);box(lidM,bw+.06,.1,bd+.06,cx,top+bh+.1,cz);
    [-1,1].forEach(k=>box(darkM,.06,bh*.6,bd+.02,cx+k*bw*.35,top+bh*.5,cz));
    BD.walls.push({x0:cx-bw/2,x1:cx+bw/2,z0:cz-bd/2,z1:cz+bd/2});BD.crate={x:cx,z:cz};
  }
  // 공통: 깃발 돛대, 어군탐지기, 꼭대기 불빛, 엔진
  const fz=zS-(t===0?.4:1.1),fh=t===0?3.2:3.4+t*.6;

    [-1,1].forEach(k=>{const mx=k*W*.2;
      box(cowM,.55*ms,.75*ms,.75*ms,mx,top+.15,mz+.2);box(trM,.57*ms,.1,.77*ms,mx,top+.3,mz+.2);

      box(cowM,.3*ms,.2,.55*ms,mx,bottom-.4,mz+.3);
      const pr=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.5*ms,6),trM);pr.rotation.x=Math.PI/2;pr.position.set(mx,bottom-.4,mz+.65);m.add(pr);
      box(trM,.6*ms,.06,.06,mx,bottom-.4,mz+.85);});
    box(cowM,W*.55,.18,.25,0,top-.05,mz-.05);}
  finderDish=new THREE.Mesh(new THREE.CylinderGeometry(.35,.1,.15,10),lam(0xdfe3ea));finderDish.position.set(.6,t===0?top+1.25:BD.cabinTop+.2,t===0?L*.18:L*.15);m.add(finderDish);
  boatLight=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),glowBasic(0x7affb0));boatLight.position.set(W*.32,top+fh+.1,fz);m.add(boatLight);
  finderDish.visible=S.finder;
  // 갑판 위 캐릭터 자리 (뱃머리 쪽 갑판)
  BD.x=.3;BD.y=top+.05;BD.z=t===0?-L*.08:BD.startZ;BD.len=L;BD.hw=W/2;BD.bow=bow;
}
const RING=['','연안 해역','가까운 바다','먼바다','심해 경계','용의 바다'];

 '길이 12m 남색 원양 어선. 높은 뱃머리, 자동 낚시 아웃리거, 그물 드럼, A자 크레인.',
 '길이 15m 강철 탐사선. 3층 브리지, 격자 돛대와 회전 레이더, 구명정, 선미 헬기 착륙장, 주황 아웃리거 낚시대, 선외기 모터 2개.',

const bar=document.getElementById('bar');
ENGINES.forEach((e,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(i+1)+'. '+e.name;b.addEventListener('click',()=>show(i));bar.appendChild(b);});
function show(i){S.engine=i;buildBoatModel();dist=10+BOAT_DIM[i].L*.9;
  document.getElementById('step').textContent=(i+1)+'단계';document.getElementById('name').textContent=ENGINES[i].name;

const cam=new THREE.PerspectiveCamera(40,1,.1,200);
let rotY=-2.3,rotX=.35,dist=24,drag=null,auto=true;const pts=new Map();let pinch=0;
r.domElement.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY};auto=false;r.domElement.setPointerCapture?.(e.pointerId);});
r.domElement.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)dist=Math.max(8,Math.min(60,dist*pinch/d));pinch=d;return;}
  if(drag){rotY-=(e.clientX-drag.x)*.008;rotX=Math.max(.05,Math.min(1.3,rotX+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY};}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(!pts.size)drag=null;};
r.domElement.addEventListener('pointerup',up);r.domElement.addEventListener('pointercancel',up);
r.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(60,dist*Math.exp(e.deltaY*.0012)));},{passive:false});
show(0);

let T=0,last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;if(auto)rotY+=dt*.25;
  for(let i=0;i<wp.count;i++){const x=base[i*3],z=base[i*3+2];wp.setY(i,.18*Math.sin(.4*x+T*1.2)+.12*Math.sin(.5*z-T)+.05*Math.sin(1.1*(x+z)+T*2));}wp.needsUpdate=true;

  cam.position.set(Math.sin(rotY)*Math.cos(rotX)*dist,Math.sin(rotX)*dist+1,Math.cos(rotY)*Math.cos(rotX)*dist);cam.lookAt(0,2.5,0);
