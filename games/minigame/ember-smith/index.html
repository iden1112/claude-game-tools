<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-height forge arena; 16:9 canvas letterboxed in the middle, DOM HUD over it, modal panels like riveted iron plates */
:root{
  --ink:#0d0912; --panel:#1a1220; --panel2:#241a2b; --line:#3e2c42; --text:#f4eadf; --muted:#a8958c;
  --ember:#ff7a2f; --ember-dk:#a8431a; --gold:#ffcf4a; --blood:#ff4d5e; --frost:#80dcff; --storm:#c9a6ff;

  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#stage{position:relative;flex:none;background:#120c18;box-shadow:0 0 0 2px var(--line),0 0 40px rgba(255,122,47,.08)}
#cv{display:block;touch-action:none;-webkit-touch-callout:none}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-size:max(11px,calc(var(--u,1) * 8.5px));line-height:1.1}
.hud-l{position:absolute;left:.8em;top:.7em;display:flex;flex-direction:column;gap:.35em;width:13em}
.hpbar{position:relative;height:1.35em;background:#2a1720;border:2px solid #000;box-shadow:inset 0 0 0 1px #4a2a33}
.hpfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff7584,#d93248);transition:width .12s}
.hptxt{position:absolute;inset:0;display:grid;place-items:center;font-size:.85em;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.hrow>span,.roomlbl{white-space:nowrap}
.roomlbl{font-size:.85em;text-shadow:0 1px 0 #000}
.hrow{display:flex;gap:.8em;align-items:center;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.gold{color:var(--gold)}
.mat{color:#ffb070}
.mat::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--ember);transform:rotate(45deg);margin-right:.35em;box-shadow:inset -2px -2px 0 #a8431a}
.ws.ready{border-color:var(--gold);animation:rdy 1s ease-in-out infinite alternate}
@keyframes rdy{from{box-shadow:0 0 0 1px #000,0 0 4px rgba(255,207,74,.3)}to{box-shadow:0 0 0 1px #000,0 0 14px rgba(255,207,74,.75)}}

.gold::before{content:"";display:inline-block;width:.7em;height:.7em;background:var(--gold);margin-right:.3em;box-shadow:inset -2px -2px 0 #b8861d}
.roomlbl{color:var(--muted)}
.items{display:flex;flex-wrap:wrap;gap:.25em}
.ic.more{color:var(--muted);border-style:dashed}
.items{max-width:11.5em}
.ic{position:relative;width:1.55em;height:1.55em;display:grid;place-items:center;background:#1b1320;border:2px solid var(--muted);font-size:.85em;color:var(--text)}
.ic img,.big-ic img,.slot img{image-rendering:pixelated;image-rendering:crisp-edges;display:block;pointer-events:none}
.ic img{width:100%;height:100%}
.ic.r1,.big-ic.r1,.slot.r1{border-color:#8a8078}
.ic.r2,.big-ic.r2,.slot.r2{border-color:#5fb0ff}
.ic.r3,.big-ic.r3,.slot.r3{border-color:#c07aff;box-shadow:0 0 6px #c07aff66}
.ic.r4,.big-ic.r4,.slot.r4{border-color:#ffb02e;box-shadow:0 0 8px #ffb02e99;animation:legend 1.6s ease-in-out infinite}
@keyframes legend{50%{box-shadow:0 0 15px #ffb02edd}}
@media (prefers-reduced-motion:reduce){.ic.r4,.big-ic.r4,.slot.r4{animation:none}}
.ic b{position:absolute;right:-.3em;bottom:-.35em;font-size:.75em;font-weight:400;color:var(--gold);text-shadow:0 1px 0 #000}
.hud-r{position:absolute;right:.8em;top:.7em;display:flex;gap:.4em;align-items:flex-start}
.ws{pointer-events:auto;width:6.6em;background:rgba(20,13,24,.82);border:2px solid var(--line);padding:.3em .35em;display:flex;flex-direction:column;gap:.2em;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.ws{box-shadow:inset 3px 0 0 var(--rc,transparent)}

.ws .rar{font-size:.7em}
.ws.empty{opacity:.45;cursor:default}
.ws .top{display:flex;gap:.3em;align-items:center}
.ws svg{width:1.3em;height:1.3em;flex:none}
.ws .nm{font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#fsBtn svg,#setBtn svg,#invBtn svg{width:1.05em;height:1.05em}
.px{position:sticky;top:-8px;align-self:flex-end;z-index:2;margin:-8px -6px -40px 0;width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);color:var(--text);font-family:var(--f-ui);font-size:20px;line-height:1;cursor:pointer;padding:0}
.px:hover,.px:focus-visible{border-color:var(--ember);outline:none}
#app.fs{padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);gap:0}
#app.fs #stage{box-shadow:none}
[hidden]{display:none!important}
#bossbar{position:absolute;left:50%;bottom:.8em;transform:translateX(-50%);width:55%;text-align:center;text-shadow:0 1px 0 #000}
#bossbar .bn{font-family:var(--f-display);color:var(--ember);letter-spacing:.06em;margin-bottom:.25em}

#tip{position:absolute;left:50%;top:21%;transform:translateX(-50%);z-index:4;width:min(72%,23em);background:rgba(20,13,24,.94);border:2px solid var(--tc,var(--line));box-shadow:0 0 0 2px #000,0 8px 24px rgba(0,0,0,.5);padding:.55em .8em;font-size:max(12px,calc(var(--u,1) * 8px));line-height:1.35;pointer-events:none;display:flex;flex-direction:column;gap:.2em}
#tip .tn{font-family:var(--f-display);font-size:1.25em}

#tip .td{color:#e8dccf}
#tip .tp{display:flex;justify-content:space-between;gap:1em;margin-top:.2em;font-variant-numeric:tabular-nums}
#tip .tp b{font-weight:400;color:var(--gold)}
#tip .tp b.no{color:var(--blood)}
#app.phone #hud{font-size:max(12.5px,calc(var(--u,1) * 9.5px))}
#app.phone .ws{width:7em}
.dashp{display:flex;gap:.25em}
.dashp i{width:1.15em;height:.42em;background:#241a2b;border:1px solid #000;box-shadow:inset 0 0 0 1px #3e2c42}
.dashp i.on{background:#e8dccf;box-shadow:0 0 4px rgba(255,255,255,.4)}
.syns{display:flex;flex-wrap:wrap;gap:.2em;max-width:12.5em}
.syn{font-size:.72em;padding:.06em .4em;border:1px solid var(--sc);color:var(--sc);background:rgba(13,9,18,.75);text-shadow:none}
.syn.lv2{background:var(--sc);color:#140d18}
.tag{display:inline-block;font-size:12px;border:1px solid;padding:0 5px;margin:2px 4px 0 0;line-height:1.5}
.synrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 8px;border:1px solid var(--line);background:var(--panel2);font-size:13px;color:var(--muted)}
.synrow b{grid-row:span 2;font-weight:400;font-size:15px;color:var(--sc)}
.synrow span.act{color:var(--text)}
.synrow.on{border-color:var(--sc)}
.syn-list{display:flex;flex-direction:column;gap:6px}
#tip .tk{color:var(--muted);font-size:.85em}
#actBtn{position:absolute;left:50%;top:58%;transform:translateX(-50%);z-index:5;font-family:var(--f-display);font-size:max(16px,calc(var(--u,1) * 11px));padding:.45em 1.2em;background:var(--gold);color:#1a0e08;border:0;box-shadow:0 4px 0 #b8861d,0 0 18px rgba(255,207,74,.5);cursor:pointer;touch-action:manipulation}
#actBtn:active{transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #b8861d}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--f-display);font-size:2em;color:var(--text);text-shadow:0 3px 0 #000,0 0 18px rgba(255,122,47,.6);opacity:0;transition:opacity .25s;padding-inline:1em}
#banner small{display:block;font-family:var(--f-ui);font-size:.5em;color:var(--gold);margin-top:.3em}
#banner.show{opacity:1}
/* Touch pad */
#pad{display:none;width:100%;max-width:720px;justify-content:space-between;align-items:flex-end;padding-block:6px 10px;gap:12px;flex:none}
#app.touch #pad{display:flex}
#app.touch:not(.portrait) #pad{position:absolute;left:0;right:0;max-width:none;bottom:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none}
#pad{--pbs:1}
#pad.lefty{flex-direction:row-reverse}
#pad.lefty .pr{grid-template-areas:"sk da sw" "at ju s2";margin-right:0;margin-left:22px}
#pad.lefty .pl{margin-left:0;margin-right:4px}
.pl{display:flex;gap:10px}
.pr{display:grid;grid-template-columns:auto auto auto;grid-template-areas:"sw da sk" "s2 ju at";gap:10px;align-items:end;justify-items:center;margin-right:22px}
.pl{margin-left:4px;display:grid;grid-template-columns:auto auto;grid-template-areas:"bg dn" "l r";gap:8px;justify-items:center;align-items:end}
.pb.dn{width:calc(60px * var(--pbs));height:calc(42px * var(--pbs));font-size:18px}
.pb.bag{width:calc(60px * var(--pbs));height:calc(42px * var(--pbs));font-size:15px;background:rgba(60,44,30,.92);border-color:#8a6a40}
.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px}
.slot{aspect-ratio:1;background:var(--panel2);border:2px solid var(--line);color:var(--text);font-family:var(--f-ui);font-size:22px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.slot.empty{border-style:dashed;color:var(--line);cursor:default;font-size:14px}
.slot img{width:64%;height:64%}
.slot.sel{outline:3px solid var(--ember);outline-offset:1px}
.slot:focus-visible{outline:3px solid var(--gold)}
.inv-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:560px){.inv-cols{grid-template-columns:1fr}}
.inv-detail{background:var(--panel2);border:2px solid var(--line);padding:10px;min-height:84px;display:flex;flex-direction:column;gap:6px}
.inv-detail .dn{font-size:19px}
.inv-detail .dd{color:var(--muted);font-size:15px}
.stat-list{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.stat-list span{color:var(--muted)}
.newitem{display:flex;gap:10px;align-items:center;background:#2a1d14;border:2px solid var(--ember);padding:10px}
.pb{pointer-events:auto;width:calc(64px * var(--pbs));height:calc(64px * var(--pbs));border:2px solid var(--line);background:rgba(36,26,43,.9);color:var(--text);font-family:var(--f-ui);font-size:17px;display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
.pb.dir{width:calc(70px * var(--pbs));height:calc(70px * var(--pbs));font-size:22px}
.pb.big{width:calc(84px * var(--pbs));height:calc(84px * var(--pbs));background:rgba(255,122,47,.9);color:#1a0e08;border-color:var(--ember-dk);font-size:20px}
.pb.sk{position:relative;overflow:hidden;background:rgba(88,48,120,.92);border-color:#8a5ab8;font-size:16px}
.pb.sk .cdv{position:absolute;left:0;right:0;bottom:0;height:var(--cd,0%);background:rgba(10,6,14,.72);pointer-events:none}
.pb.sk .lbl{position:relative;pointer-events:none}
.pb.sk.ready{box-shadow:0 0 12px rgba(201,166,255,.6)}
.pb.sk2{background:rgba(150,90,20,.92);border-color:#ffb02e;font-size:14px}
.pb.sk2.ready{box-shadow:0 0 12px rgba(255,176,46,.65)}
.pb.sk2.off{visibility:hidden}
.xp2{height:.25em;background:#000;margin-top:2px}.xp2 i{display:block;height:100%;width:0;background:#ffb02e}.xp2.full i{box-shadow:0 0 6px #ffb02e}
.pb.on{filter:brightness(1.4);transform:scale(.95)}
/* Modals */
#ov:empty{display:none}
#ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,5,12,.74);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
.panel{touch-action:pan-y;position:relative;width:100%;max-width:620px;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 4px var(--ink),0 0 0 6px #2a1d2e,0 24px 60px rgba(0,0,0,.6);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box}
.panel::before,.panel::after{content:"";position:absolute;top:8px;width:6px;height:6px;background:#5a4048;box-shadow:inset -1px -1px 0 #2a1d22}
.panel::before{left:8px}.panel::after{right:8px}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--ember)}
h1,h2{margin:0;font-family:var(--f-display);font-weight:400;text-wrap:balance}
h1{font-size:clamp(40px,9vw,64px);line-height:1;color:var(--text);text-shadow:0 4px 0 var(--ember-dk),0 0 30px rgba(255,122,47,.35)}
h2{font-size:28px}
.sub{margin:0;color:var(--muted);font-size:17px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.35;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover:not(:disabled),.card:focus-visible{border-color:var(--ember);transform:translateY(-2px);outline:none}
.card:disabled{opacity:.4;cursor:default}
.card .ct{display:flex;align-items:center;gap:8px}
.card .cn{font-size:20px}
.card .cd{color:var(--muted)}
.card .cs{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .tree{font-size:13px;color:var(--muted)}
.card .price{margin-top:auto;color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
.wprev{display:block;width:100%;height:58px;background:radial-gradient(ellipse at center,rgba(255,122,47,.08),transparent 70%),#140d18;border:1px solid var(--line)}
.card .rtag{font-size:13px;letter-spacing:.06em}
.card .afx{font-size:13px;color:#d8e8ff;line-height:1.5}
.card.rare1{border-color:#3a6ea8}.card.rare2{border-color:#7a4aa8}.card.rare3{border-color:#c08020;box-shadow:0 0 14px rgba(255,176,46,.25)}
.card .skill{font-size:13px;color:#d8b8ff}
.card .cost{font-size:14px;color:#ffb070}
.card .price.no{color:var(--blood)}
.card svg{width:28px;height:28px;flex:none}
.big-ic{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--muted);background:#140d18;font-size:17px;flex:none}
.big-ic img{width:30px;height:30px}
.tier{font-size:12px;letter-spacing:.12em;color:var(--ember)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-ui);font-size:19px;padding:11px 20px;background:var(--ember);color:#1a0e08;border:0;box-shadow:0 4px 0 var(--ember-dk);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ember-dk)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn:focus-visible,.pb:focus-visible,.ws:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;color:var(--muted)}
.keys b{font-weight:400;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--panel2);border:2px solid var(--line);padding:10px}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.goldline{color:var(--gold);font-size:19px;font-variant-numeric:tabular-nums}
.set-group{display:flex;flex-direction:column;gap:6px}
.set-group h3{margin:4px 0 2px;font-family:var(--f-ui);font-weight:400;font-size:14px;letter-spacing:.16em;color:var(--ember)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:9px 12px;background:var(--panel2);border:2px solid var(--line);flex-wrap:wrap}
.set-row>div:first-child{min-width:0;flex:1 1 140px}
.set-row .lb{font-size:17px}
.set-row .hint{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.seg{display:flex;border:2px solid var(--line);flex:none}
.seg button{font-family:var(--f-ui);font-size:15px;padding:7px 11px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ember);color:#1a0e08}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--muted);transition:transform .12s}

.set-row input[type=range]{accent-color:var(--ember);width:min(170px,100%)}
.btn.small{font-size:16px;padding:8px 14px}
.btn.danger{background:transparent;color:var(--blood);border:2px solid #5a2630;box-shadow:none}
@media (prefers-reduced-motion:reduce){.card,.hpfill,#banner,.sw::after{transition:none}}
</style>

function physics(e,dt){

  e.x+=e.vx*dt;e.hitWall=false;
  if(e.x<0){e.x=0;e.vx=0;e.hitWall=true}else if(e.x+e.w>G.room.w){e.x=G.room.w-e.w;e.vx=0;e.hitWall=true}

    if(e.kind&&e.kind!=='boss'&&g0&&e.grav&&!(e.kbT>0)&&e.state!=='charge'&&e.state!=='thrust')e.vy=-Math.sqrt(2*GRAV*Math.max(12,e.y+e.h-s.y+8))}}
  const prevB=e.y+e.h;
  if(!e.noGrav)e.vy=Math.min(e.vy+GRAV*dt,560);
  e.y+=e.vy*dt;e.onGround=false;
  if(S&&S.length&&e.vy>=0)for(const s of S){if(e.x+e.w>s.x+.5&&e.x<s.x+s.w-.5&&prevB<=s.y+1.5&&e.y+e.h>=s.y){e.y=s.y-e.h;e.vy=0;e.onGround=true;return}}
  if(e.y+e.h>=FLOOR){e.y=FLOOR-e.h;e.vy=0;e.onGround=true;return}
  if(e.vy>=0&&!(e.dropT>0)){
    for(const p of G.room.plats){
      if(e.x+e.w>p.x+1&&e.x<p.x+p.w-1&&prevB<=p.y+1&&e.y+e.h>=p.y){e.y=p.y-e.h;e.vy=0;e.onGround=true;break}
    }
  }
}

function damageEnemy(e,dmg,o={}){
  if(e.dead)return;
  const s=st();let crit=false;const f=o.form;
  if(e.invul){if(o.src!=='dot')num(e.x+e.w/2,e.y-4,'무적','#9aa6b8');return}
  if(o.src!=='dot'&&(Math.random()<s.crit+(f&&f.crit||0)||G.critAllT>0||(G.critNext&&(o.src==='melee'||o.src==='arrow')))){dmg*=s.critMul;crit=true;if(o.src==='melee'||o.src==='arrow')G.critNext=false}
  if(G.items.exec&&o.src!=='dot'&&e.hp<e.maxHp*.3)dmg*=1.5;
  if(o.src!=='dot'){if(G.items.toxicfang&&e.poisonT>0)dmg*=1.2;if(G.items.skull&&(e.boss||e.elite))dmg*=1.25;
    if(G.items.nightblade&&o.fromX!=null&&(o.src==='melee'||o.src==='arrow')&&Math.sign(o.fromX-(e.x+e.w/2))===-(e.face||1))dmg*=1.4}
  if(e.chill>0&&o.src!=='dot')dmg*=1.5;
  if(e.curse>0&&o.src!=='dot')dmg*=1.3;
  if(e.kind==='knight'&&o.src!=='dot'&&o.src!=='boom'&&e.state!=='stun'&&e.freeze<=0&&o.fromX!=null){
    const fromLeft=o.fromX<e.x+e.w/2;const front=(fromLeft&&e.face<0)||(!fromLeft&&e.face>0);
    if(front){
      if((f&&(f.w==='hammer'||f.shieldBreak||(BASE[f.w]&&BASE[f.w].breaker))&&o.src==='melee')||o.src==='skill'){e.state='stun';e.st=1.1;num(e.x+e.w/2,e.y-8,'방패 파괴!','#ffcf4a',true);burst(e.x+e.w/2+(fromLeft?-6:6),e.y+8,12,['#9aa6b8','#dfe6f0'],140)}
      else{dmg*=.2;if(o.kx)o.kx*=.25;num(e.x+e.w/2,e.y-6,'막힘','#9aa6b8');SFX.block();burst(e.x+e.w/2+(fromLeft?-6:6),e.y+8,5,'#dfe6f0',90);crit=false}
    }
  }
  if(o.src!=='dot'){dmg*=itemMod(e,o);if(e.tired)dmg*=1.5}
  e.hp-=dmg;e.flash=.09;e.hitT=.14;e.hitDir=Math.sign((e.x+e.w/2)-(o.fromX??e.x))||1;
  if(o.kx&&!e.boss){e.vx=o.kx*s.kbMul*(e.kind==='brute'||e.elite?.35:1);if(e.grav)e.vy=Math.min(e.vy,-80*(o.heavy?1.7:1));else e.vy=-30;e.kbT=o.heavy?.28:.16}
  if(o.src!=='dot'||Math.random()<.5)num(e.x+e.w/2,e.y-2,Math.max(1,Math.round(dmg)),crit?'#ffcf4a':o.src==='dot'?(o.dotc||'#ff9a4d'):o.src==='chain'||o.src==='bolt'?'#d8c2ff':'#ffffff',crit);
  if(o.src!=='dot'){const c=ctr(e);burst(c.x,c.y,crit?9:5,f?[f.color,'#fff']:['#fff','#ffd9a8'],crit?160:110,{life:.35});if(crit)addShake(3)}
  if(f&&o.src!=='dot'){
    if(f.burn){e.burn=2.6;e.burnDmg=(f.burn===2?5.5:3)*s.dmgMul}
    if(f.freeze){e.chill=e.boss?1.2:2.6;if(f.freeze===2){e.freeze=Math.max(e.freeze,e.boss?.3:1.0)}SFX.freeze()}
    if(f.chain&&!o.chained&&(o.src==='melee'||o.src==='skill'))chain(e,f.chain,dmg*.5,f);
    if(f.poison){e.poisonN=Math.min(s.psnCap,(e.poisonN||0)+1);e.poisonT=3;e.poisonLv=Math.max(e.poisonLv||0,f.poison)}
    if(f.curse){e.curse=4;e.curseLv=Math.max(e.curseLv||0,f.curse)}
    if(f.lifesteal&&o.src==='melee')healP(f.lifesteal*s.lsMul,false);
    if(crit&&f.critKnife&&o.src==='melee'){const p=G.player;G.proj.push({owner:'p',type:'knife',x:p.x+p.w/2,y:p.y+7,w:8,h:4,vx:p.face*420,vy:0,dmg:dmg*.3,pierce:0,hit:new Set(),life:.6,form:null,src:'arrow',kb:40,c:f.color})}
  }
  if(f&&f.legend&&o.src!=='dot'&&o.src!=='boom'&&Math.random()<.15){const c=ctr(e);later(.03,()=>explode(c.x,c.y,38,dmg*.6,f.color,f))}
  if(G.items.forge&&o.src!=='dot'&&!(f&&f.burn)&&Math.random()<.25){e.burn=2.6;e.burnDmg=3*s.dmgMul}

  if(o.src!=='dot'&&o.src!=='boom'){const sy=s.syn;
    if(sy.fire&&!(e.burn>0)&&Math.random()<.15){e.burn=2.6;e.burnDmg=Math.max(e.burnDmg||0,3*s.dmgMul)}
    if(sy.ice&&Math.random()<.2)e.chill=Math.max(e.chill,2.2);

    if(sy.poison&&Math.random()<.25){e.poisonN=Math.min(s.psnCap,(e.poisonN||0)+1);e.poisonT=3;e.poisonLv=Math.max(e.poisonLv||0,1)}
    if(!o.chained&&((sy.volt&&Math.random()<.12)||(G.items.sparkgem&&Math.random()<.1)))chain(e,1,dmg*.5,{color:'#c9a6ff'});
    if(sy.volt>=2&&crit&&!o.chained){const c2=ctr(e);G.fx.push({type:'zap',pts:jag(c2.x+rand(-8,8),0,c2.x,c2.y),life:.2,max:.2,c:'#efe2ff',w:3});later(.02,()=>damageEnemy(e,dmg*.5,{src:'bolt',chained:true,fromX:c2.x}))}
    if(G.items.emberfang&&e.burn>0&&Math.random()<.15)healP(1,false)}
  if(G.items.deathmark&&o.src!=='dot'&&!e.boss&&!e.elite&&e.hp>0&&e.hp<e.maxHp*.15){e.hp=0;num(e.x+e.w/2,e.y-10,'처형','#ff4a5a',true)}
  if(o.src!=='dot'&&o.src!=='boom'&&o.src!=='chain'&&o.src!=='bolt'&&!o.chained)itemHook('hit',e,dmg,o,crit,s);

function chain(from,n,dmg,f){
  const c0=ctr(from);
  n+=(st().syn.volt>=2?2:0)+(G.items.stormcrown?1:0);
  const t=G.enemies.filter(e=>!e.dead&&e!==from).map(e=>({e,d:Math.hypot(ctr(e).x-c0.x,ctr(e).y-c0.y)})).filter(o=>o.d<120).sort((a,b)=>a.d-b.d).slice(0,n);
  let prev=c0;
  for(const {e} of t){const c=ctr(e);G.fx.push({type:'zap',pts:jag(prev.x,prev.y,c.x,c.y),life:.18,max:.18,c:f.color});prev=c;damageEnemy(e,dmg,{src:'chain',chained:true,form:f,fromX:c0.x})}
  if(t.length)SFX.zap();
}
function jag(x1,y1,x2,y2){const pts=[[x1,y1]];const n=6;for(let i=1;i<n;i++){const t=i/n;pts.push([lerp(x1,x2,t)+rand(-5,5),lerp(y1,y2,t)+rand(-5,5)])}pts.push([x2,y2]);return pts}
function explode(x,y,r,dmg,c='#ff9a3c',form=null){

  SFX.boom();addShake(4);
  for(const e of G.enemies){if(e.dead)continue;const c2=ctr(e);if(dmg>0&&Math.hypot(c2.x-x,c2.y-y)<r+e.w/2)damageEnemy(e,dmg,{src:'boom',form,kx:Math.sign(c2.x-x||1)*140})}
}

function swingArc(f,b,combo,fin){
  const p=G.player,R=f.range*(fin?1.15:1)+3,cy=p.y+(b==='hammer'?5:8);
  let lo,hi;if(b==='hammer'){lo=-2.4;hi=.6}else if(b==='scythe'){lo=-3.15;hi=3.15}else if(b==='greatsword'){lo=-2.6;hi=.9}else if(b==='flail'){lo=-3;hi=1.25}else if(b==='halberd'){lo=-2.7;hi=1.05}else{lo=-1.95;hi=1.05}
  return{cx:p.x+p.w/2,cy,R,lo,hi};
}
function arcHit(A,dmg,kb,f,heavy){
  const p=G.player;let hit=0;
  for(const e of G.enemies){if(e.dead)continue;let ok=false;
    const pts=[[clamp(A.cx,e.x,e.x+e.w),clamp(A.cy,e.y,e.y+e.h)]];
    for(let i=0;i<=2;i++)for(let j=0;j<=2;j++)pts.push([e.x+e.w*i/2,e.y+e.h*j/2]);
    for(const [x,y] of pts){const dx=(x-A.cx)*p.face,dy=y-A.cy,d=Math.hypot(dx,dy);if(d>A.R)continue;if(d<9){ok=true;break}const an=Math.atan2(dy,dx);if(an>=A.lo-.3&&an<=A.hi+.3){ok=true;break}}
    if(ok){hit++;const dir=Math.sign(e.x+e.w/2-A.cx)||p.face;damageEnemy(e,dmg,{kx:dir*kb,src:'melee',form:f,fromX:A.cx,heavy})}
  }

function update(dt){

  for(const l of G.later){l.t-=dt;if(l.t<=0){l.done=true;l.fn()}}
  G.later=G.later.filter(l=>!l.done);
  if(G.over)return;
  updPlayer(dt);
  for(const e of G.enemies)if(!e.dead)updEnemy(e,dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  updProj(dt);
  for(const w of G.warn){w.t-=dt;if(w.t<=0&&!w.done){w.done=true;if(w.fn)w.fn()}}G.warn=G.warn.filter(w=>!w.done);

}

  for(const n of G.nums){n.life-=dt;n.y+=n.vy*dt;n.vy*=Math.pow(.05,dt)}G.nums=G.nums.filter(n=>n.life>0);
  G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt);G.wflash=Math.max(0,(G.wflash||0)-dt*1.4);G.cine=Math.max(0,(G.cine||0)-dt);

    if(G.trans.phase==='out'){G.fade=Math.min(1,G.trans.t/.32);if(G.trans.t>=.32){if(R.type==='boss'){G.stage++;G.roomIdx=0}else G.roomIdx++;buildRoom();G.trans={t:0,phase:'in'}}}

  else G.fade=Math.max(0,G.fade-dt*3);
}

  const ws=G.weapons.map((w,i)=>{const f=FORMS[w.form];const c=f.next?evoCost(f.t):0;return `<div class="stat" style="border-color:${RAR[f.t-1].c}55"><span><b style="font-weight:400;color:${RAR[f.t-1].c}">${RAR[f.t-1].n}</b> · ${TIERNAME[f.t]} · 스킬 ${skN(f)}</span><strong style="color:${f.color};font-size:20px">${esc(f.name)}</strong><div class="cd" style="color:var(--muted);font-size:14px">${esc(f.desc)}</div>${(w.af||[]).length?`<div style="font-size:13px;color:#d8e8ff">${w.af.map(k=>'+ '+AFFIX[k]).join(' · ')}</div>`:''}${f.next?`<div style="font-size:13px;color:var(--muted);margin-top:6px">다음 진화: 잿불석 ${c}개 · 화로 정령에게서</div>`:''}</div>`}).join('');
  const its=`<div class="row"><button class="btn ghost small" data-act="openInv" type="button">가방 열기 · 아이템 ${itemCount()}/${ITEM_CAP}</button></div>`;
  ov.innerHTML=`<div class="panel" role="dialog" aria-label="일시정지"><button class="px" data-act="close" type="button" aria-label="닫기" title="닫기">✕</button><div class="eyebrow">일시정지 · 잿불석 ${G.mats}개 · 방에 들어갈 때마다 자동 저장</div><h2>${flName()} · ${G.kills}처치</h2>
  <div class="stats">${ws}</div><div style="display:flex;flex-direction:column;gap:8px">${its}</div>
  <div class="row"><button class="btn" data-act="close" type="button">계속하기</button><button class="btn ghost" data-act="settings" type="button">설정</button><button class="btn ghost" data-act="fs" type="button">${FS?'전체화면 끄기':'전체화면'}</button><button class="btn ghost" data-act="saveExit" type="button">저장하고 나가기</button><button class="btn ghost" data-act="quit" type="button">포기하기</button></div></div>`;
}
let setBack='title';
function openSettings(back){
  setBack=back;if(G)G.modal='settings';clearKeys();
  const seg=(k,opts,lbl)=>`<div class="seg" role="group" aria-label="${lbl}">${opts.map((o,i)=>`<button type="button" data-act="set" data-k="${k}" data-v="${i}" aria-pressed="${SET[k]===i}">${o}</button>`).join('')}</div>`;
  const sw=(k,lbl)=>`<button type="button" class="sw" role="switch" data-act="tog" data-k="${k}" aria-checked="${!!SET[k]}" aria-label="${lbl}"></button>`;
  const row=(label,hint,ctl)=>`<div class="set-row"><div><span class="lb">${label}</span>${hint?`<span class="hint">${hint}</span>`:''}</div>${ctl}</div>`;
  const best=store.get('ember_best',null);
  ov.innerHTML=`<div class="panel" role="dialog" aria-label="설정"><button class="px" data-act="setBack" type="button" aria-label="설정 닫기" title="닫기">✕</button><div class="eyebrow">${back==='title'?'게임 옵션':'일시정지 중'}</div><h2>설정</h2>
  <div class="set-group"><h3>소리</h3>
    ${row('소리','',sw('sound','소리'))}
    ${row('음량',`<span id="volTxt">${SET.vol}%</span>`,`<input type="range" id="setVol" min="0" max="100" step="5" value="${SET.vol}" aria-label="음량">`)}
  </div>
  <div class="set-group"><h3>화면</h3>
    ${row('전체화면','게임 화면 오른쪽 위 버튼으로도 켜고 끌 수 있어요',`<button type="button" class="sw" role="switch" data-act="fs" aria-checked="${FS}" aria-label="전체화면"></button>`)}
    ${row('화면 흔들림','',seg('shake',['끔','약하게','보통'],'화면 흔들림'))}
    ${row('파티클 양','기기가 느리면 적게',seg('parts',['적게','보통','많이'],'파티클 양'))}
    ${row('데미지 숫자','',sw('nums','데미지 숫자'))}
    ${row('피격 붉은 화면','맞았을 때와 체력이 낮을 때의 깜빡임',sw('flash','피격 붉은 화면'))}
    ${row('타격 멈춤','때리는 순간 화면이 잠깐 멈추는 효과',sw('hitstop','타격 멈춤'))}
    ${row('FPS 표시','화면 위쪽 가운데에 표시',sw('fps','FPS 표시'))}
  </div>
  <div class="set-group"><h3>게임</h3>
    ${row('난이도','쉬움: 받는 피해 40% 감소 · 어려움: 적이 단단하고 아프다. 새로 나오는 적부터 적용',seg('diff',['쉬움','보통','어려움'],'난이도'))}
    ${row('자동 공격','가까이 있는 적을 알아서 공격해요',sw('autoAtk','자동 공격'))}
  </div>
  <div class="set-group"><h3>기기 · 조작</h3>
    ${row('기기 모드','핸드폰: 화면 버튼, 큰 글씨, 터치 안내 · 컴퓨터: 버튼 숨김, 키보드 안내 · 자동: 기기에 맞춰 선택',seg('device',['자동','핸드폰','컴퓨터'],'기기 모드'))}
    ${row('버튼 크기','',seg('btnSize',['작게','보통','크게'],'버튼 크기'))}
    ${row('버튼 투명도',`<span id="alphaTxt">${SET.btnAlpha}%</span>`,`<input type="range" id="setAlpha" min="30" max="100" step="5" value="${SET.btnAlpha}" aria-label="버튼 투명도">`)}
    ${row('왼손잡이 모드','이동 버튼을 오른쪽, 공격 버튼을 왼쪽으로',sw('lefty','왼손잡이 모드'))}
  </div>
  <div class="set-group"><h3>기록</h3>
    ${row('최고 기록',best?`${best.clear?'게임 클리어':best.stage+'층 '+best.room+'번째 방'} · ${best.kills}처치`:'아직 기록이 없어요',`<button type="button" class="btn danger small" data-act="resetBest" ${best?'':'disabled'}>기록 지우기</button>`)}
    ${row('저장된 진행',getSave()?esc(saveLabel(getSave())):'저장된 진행이 없어요',`<button type="button" class="btn danger small" data-act="delSave" ${getSave()?'':'disabled'}>저장 지우기</button>`)}
    ${row('설정 초기화','모든 설정을 처음 값으로',`<button type="button" class="btn ghost small" data-act="resetSet">초기화</button>`)}
  </div>
  <div class="row"><button class="btn" data-act="setBack" type="button">돌아가기</button></div></div>`;
  ov.querySelector('.row [data-act="setBack"]').focus({preventScroll:true});
}
ov.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='setVol'){SET.vol=+t.value;setVol();$('volTxt').textContent=SET.vol+'%';saveSet()}
  else if(t.id==='setAlpha'){SET.btnAlpha=+t.value;applyPad();$('alphaTxt').textContent=SET.btnAlpha+'%';saveSet()}
});
ov.addEventListener('change',e=>{if(e.target.id==='setVol'){audioInit();SFX.coin()}});
function applyPad(){pad.style.setProperty('--pbs',[.82,1,1.22][SET.btnSize]);pad.style.opacity=SET.btnAlpha/100;pad.classList.toggle('lefty',!!SET.lefty)}
function applySet(){AU.on=SET.sound;setVol();applyPad();layout()}

/* ---------- Fullscreen ---------- */
let FS=false,nativeFS=false;
const FS_ON='<svg viewBox="0 0 16 16"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',FS_OFF='<svg viewBox="0 0 16 16"><path d="M6 1v5H1M15 6h-5V1M10 15v-5h5M1 10h5v5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function setFS(on){
  FS=on;app.classList.toggle('fs',on);{const fb=$('fsBtn');fb.innerHTML=on?FS_OFF:FS_ON;fb.setAttribute('aria-label',on?'전체화면 끄기':'전체화면');fb.title=on?'전체화면 끄기':'전체화면'}
  const cur=document.fullscreenElement||document.webkitFullscreenElement;
  if(on){
    try{const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;if(req&&!cur){const pr=req.call(el,{navigationUI:'hide'});if(pr&&pr.catch)pr.catch(()=>{})}}catch(e){}
    try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
  }else if(cur){try{const ex=document.exitFullscreen||document.webkitExitFullscreen;const pr=ex&&ex.call(document);if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}
  layout();setTimeout(layout,120);setTimeout(layout,400);
}
function onFsChange(){const el=document.fullscreenElement||document.webkitFullscreenElement;if(el)nativeFS=true;else if(nativeFS){nativeFS=false;if(FS)setFS(false)}layout()}
document.addEventListener('fullscreenchange',onFsChange);document.addEventListener('webkitfullscreenchange',onFsChange);
$('fsBtn').addEventListener('click',()=>{audioInit();SFX.click();setFS(!FS)});

function gameOver(){
  clearSave();
  G.over=true;const p=G.player;burst(p.x+5,p.y+8,40,['#ff4d5e','#ff7a2f','#fff'],220,{life:.9});addShake(10);SFX.boom();
  const best=store.get('ember_best',null);const score=G.stage*10+G.roomIdx;const isBest=!best||score>best.stage*10+(best.room-1);
  if(isBest)store.set('ember_best',{stage:G.stage,room:G.roomIdx+1,kills:G.kills});
  setTimeout(()=>{G.modal='over';
    ov.innerHTML=`<div class="panel" role="dialog" aria-label="게임 오버"><div class="eyebrow">${isBest?'새 최고 기록':'불씨가 꺼졌다'}</div><h2>대장장이가 쓰러졌다</h2>
    <div class="stats"><div class="stat"><span>도달</span><strong>${flName()} ${G.roomIdx+1}번째 방</strong></div><div class="stat"><span>처치</span><strong>${G.kills}</strong></div><div class="stat"><span>모은 아이템</span><strong>${Object.values(G.items).reduce((a,b)=>a+b,0)}</strong></div></div>
    <div class="stats">${G.weapons.map(w=>{const f=FORMS[w.form];return `<div class="stat"><span>${TIERNAME[f.t]}</span><strong style="color:${f.color};font-size:20px">${esc(f.name)}</strong></div>`}).join('')}</div>
    <div class="row"><button class="btn" data-act="again" type="button">다시 도전</button><button class="btn ghost" data-act="title" type="button">처음 화면</button></div></div>`},900);
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;audioInit();SFX.click();
  const a=b.dataset.act;
  if(a==='start'){if(getSave()&&!b.dataset.confirm){b.dataset.confirm='1';b.textContent='한 번 더 누르면 저장이 지워져요';return}clearSave();openPick()}
  else if(a==='continue'){const d=getSave();if(d){ov.innerHTML='';newGame(d.weapons.find(w=>FORMS[w.form]).form,d);last=performance.now();banner('이어하기',`${d.stage}층 ${d.roomIdx+1}번째 방부터`)}}
  else if(a==='saveExit'){saveRun();ov.innerHTML='';G=null;$('hud').hidden=true;$('bossbar').hidden=true;openTitle()}
  else if(a==='delSave'){if(b.dataset.confirm){clearSave();b.textContent='저장을 지웠어요';b.disabled=true}else{b.dataset.confirm='1';b.textContent='한 번 더 누르면 지워져요'}}
  else if(a==='pick'){ov.innerHTML='';newGame(b.dataset.id);last=performance.now()}
  else if(a==='devCycle'){SET.device=(SET.device+1)%3;saveSet();applySet();b.textContent=['자동','핸드폰','컴퓨터'][SET.device]+' 모드'}
  else if(a==='settings')openSettings(G&&!G.over?'pause':'title');
  else if(a==='set'){SET[b.dataset.k]=+b.dataset.v;saveSet();b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));applySet()}
  else if(a==='tog'){const k=b.dataset.k;SET[k]=!SET[k];saveSet();b.setAttribute('aria-checked',String(SET[k]));applySet()}
  else if(a==='fs'){setFS(!FS);if(b.classList.contains('sw'))b.setAttribute('aria-checked',String(FS));else b.textContent=FS?'전체화면 끄기':'전체화면'}
  else if(a==='setBack'){if(setBack==='game'&&G)closeModal();else if(setBack==='pause'&&G)openPause();else{ov.innerHTML='';openTitle()}}
  else if(a==='resetBest'){if(b.dataset.confirm){store.set('ember_best',null);b.textContent='기록을 지웠어요';b.disabled=true}else{b.dataset.confirm='1';b.textContent='한 번 더 누르면 지워져요'}}
  else if(a==='resetSet'){Object.assign(SET,DEFAULTS);saveSet();applySet();openSettings(setBack)}
  else if(a==='close')closeModal();
  else if(a==='buy')buy(+b.dataset.i);
  else if(a==='reroll'){if(G.gold>=G.rerollCost){G.gold-=G.rerollCost;G.rerollCost+=5;const keep=G.room.offers.filter(o=>o.kind!=='item');const ex=[];const items=[];for(let i=0;i<3;i++){const id=randItem(ex);if(id){ex.push(id);items.push({kind:'item',id,price:Math.round(PRICE[ITEMS[id].r]*sc())})}}G.room.offers=items.concat(keep);hudDirty=true;openShop()}}
  else if(a==='evolve')doEvolve(b.dataset.id);
  else if(a==='evoW'){ov.innerHTML='';G.modal=null;openEvolve(+b.dataset.i)}
  else if(a==='take'){const k=G.altar;if(k){k.done=true;G.picks=G.picks.filter(x=>x!==k);closeModal();takeWeapon(k.wo||mkW(k.form));SFX.evolve()}}
  else if(a==='dismantle'){const k=G.altar;if(k){k.done=true;G.picks=G.picks.filter(x=>x!==k);const m=dismVal(k.wo||mkW(k.form));G.mats+=m;closeModal();banner('분해 완료',`잿불석 +${m}`);SFX.buy();hudDirty=true}}
  else if(a==='newRun'){ov.innerHTML='';G=null;$('hud').hidden=true;$('bossbar').hidden=true;openPick()}
  else if(a==='rewardLater'){rewardLater()}
  else if(a==='reward'){const id=b.dataset.id,it=ITEMS[id];const done=()=>{G.pendingReward=null;for(const k of G.picks)if(k.type==='rchest'&&k.kind==='reward')k.done=true;G.picks=G.picks.filter(k=>!k.done)};
    if(itemCount()<ITEM_CAP){addItem(id);done();closeModal();banner(it.name,it.desc);SFX.buy();const p=G.player;G.fx.push({type:'icon',id,x:p.x+5,y:p.y-6,life:1.6,max:1.6})}else openInventory({newItem:id,onYes:()=>{done();banner(it.name,it.desc)},onNo:()=>rewardLater()})}
  else if(a==='slot'){invSel=+b.dataset.i;renderInventory()}
  else if(a==='discard'){const sl=invSlots()[invSel];if(sl){removeItem(sl);G.mats+=1;banner('아이템을 버렸다','잿불석 +1');invSel=-1;renderInventory()}}
  else if(a==='swapIn'){const sl=invSlots()[invSel],ctx2=invCtx;if(sl&&ctx2){removeItem(sl);G.mats+=1;addItem(ctx2.newItem);invCtx=null;closeModal();SFX.buy();if(ctx2.onYes)ctx2.onYes()}}
  else if(a==='skipNew'){const ctx2=invCtx;invCtx=null;closeModal();if(ctx2&&ctx2.onNo)ctx2.onNo()}
  else if(a==='openInv'){openInventory()}
  else if(a==='quit'){ov.innerHTML='';G.modal=null;gameOver()}
  else if(a==='again'){ov.innerHTML='';openPick();G=null;$('hud').hidden=true}
  else if(a==='title'){ov.innerHTML='';G=null;$('hud').hidden=true;openTitle()}
});

/* ---------- Loop ---------- */
let last=performance.now(),fpsAcc=0,fpsN=0,fpsVal=0;
function drawFps(){ctx.setTransform(S*DPR,0,0,S*DPR,0,0);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W/2-20,3,40,11);ctx.font='8px "Do Hyeon",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=fpsVal>=50?'#8fe08a':fpsVal>=30?'#ffcf4a':'#ff4d5e';ctx.fillText(fpsVal+' FPS',W/2,9)}
function frame(now){
  requestAnimationFrame(frame);
  try{step(now)}catch(err){console.error(err);if(G&&G.player)G.player.swing=G.player.swing||{combo:0,third:false}}
}
function step(now){
  const raw=(now-last)/1000;let dt=Math.min(.033,raw);last=now;
  fpsAcc+=raw;fpsN++;if(fpsAcc>=.5){fpsVal=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0}
  if(G){
    if(!G.modal){
      if(G.slow>0){G.slow-=dt;dt*=.35}
      if(!SET.hitstop)G.hitstop=0;
      if(G.hitstop>0){G.hitstop-=dt;updCommon(dt*.15)}
      else{update(dt);updCommon(dt)}
    }
    hud();
    if(G.modal)drawPreviews();
    {const ab=$('actBtn'),busy=!!(G.modal||G.trans),no=!busy?G.nearOffer:null,nw=!busy?G.nearWeapon:null;let txt='';
      if(!busy){if(nw)txt='줍기 · 꾹 누르면 분해';else if(G.nearChest)txt='상자 열기';else if(G.nearForge)txt='진화하기';else if(no)txt=no.kind==='reroll'?`새로 고침 · ${priceOf(no)}G`:`구매 · ${priceOf(no)}G`;else if(G.nearDoor)txt=G.nearDoor.label==='상점'?'상점 들어가기':G.nearDoor.label+(G.nearDoor.kind?' 입장':' 방 들어가기')}
      const show=phoneMode()&&!!txt;if(ab.hidden===show)ab.hidden=!show;if(show&&ab.textContent!==txt)ab.textContent=txt;
      const tip=$('tip');
      if(nw){const wo=nw.wo||mkW(nw.form),f=FORMS[wo.form],rr=RAR[f.t-1],key='w'+wo.form+(phoneMode()?1:0);if(tip.dataset.k!==key){tip.dataset.k=key;tip.style.setProperty('--tc',rr.c);
          tip.innerHTML=`<div class="tn" style="color:${f.color}">${esc(f.name)}</div><div class="tt"><span style="color:${rr.c}">${rr.n}</span> · ${TIERNAME[f.t]} · 스킬 ${esc(SKPRE[f.t]+skN(f))}</div><div class="td">${esc(f.desc)}</div><div class="tp"><b>분해하면 잿불석 +${dismVal(wo)}</b><span class="tk">${phoneMode()?'짧게: 줍기 · 꾹: 분해':'F 짧게: 줍기 · F 길게: 분해'}</span></div>`}if(tip.hidden)tip.hidden=false}
      else if(no){const key='o'+G.room.offers.indexOf(no)+':'+(no.id||no.w||no.kind)+':'+G.gold+':'+G.rerollCost;if(tip.dataset.k!==key){tip.dataset.k=key;const inf=offerInfo(no),pr=priceOf(no);
          tip.style.setProperty('--tc',inf.c);tip.innerHTML=`<div class="tn" style="color:${inf.c}">${esc(inf.n)}</div><div class="tt">${esc(inf.tag)}</div><div class="td">${esc(inf.d)}</div>${inf.tags||''}<div class="tp"><b class="${G.gold>=pr?'':'no'}">${pr} 골드</b><span class="tk">${phoneMode()?'구매 버튼':'F · ↑ 구매'}</span></div>`}
        if(tip.hidden)tip.hidden=false}else if(!tip.hidden){tip.hidden=true;tip.dataset.k=''}}
  }else{for(const a of amb){a.y+=a.vy*dt;a.x+=a.vx*dt;if(a.y<-4){a.y=H+2;a.x=Math.random()*W}}}
  if(G)for(const a of amb){a.y+=a.vy*dt*.5;a.x+=a.vx*dt;if(a.y<-4){a.y=H+2;a.x=Math.random()*W}}
  render();if(SET.fps)drawFps();
}
applyPad();layout();openTitle();
if(document.fonts&&document.fonts.load){document.fonts.load('10px "Do Hyeon"').catch(()=>{})}
requestAnimationFrame(frame);
})();
</script>
