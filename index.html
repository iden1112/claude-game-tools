<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iden1112 게임 PC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Segoe UI","Pretendard","Noto Sans KR",system-ui,sans-serif;user-select:none;color:#1b1b1b}
/* 바탕화면 */
#desk{position:fixed;inset:0 0 48px 0;background:
  radial-gradient(ellipse at 70% 120%,#4a8fe0 0%,transparent 55%),
  radial-gradient(ellipse at 15% -10%,#a6c8ff 0%,transparent 50%),
  radial-gradient(ellipse at 100% 0%,#173b8a 0%,transparent 60%),
  linear-gradient(160deg,#0f2a6b 0%,#1c4fb3 45%,#3a7bd9 75%,#8fbcff 100%)}
#desk::after{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 35% at 50% 105%,rgba(255,255,255,.35),transparent 70%),
  radial-gradient(ellipse 40% 60% at 50% 60%,rgba(140,190,255,.25),transparent 70%);pointer-events:none}
#icons{position:absolute;top:10px;left:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,104px);gap:4px;height:calc(100% - 20px);z-index:1}
.ico{width:88px;padding:6px 2px;border-radius:4px;text-align:center;color:#fff;font-size:12px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:default;border:1px solid transparent}
.ico:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.ico.sel{background:rgba(120,170,255,.35);border-color:rgba(190,215,255,.6)}
.ico .pic{font-size:40px;line-height:48px;height:50px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.folder{display:inline-block;width:48px;height:38px;position:relative;margin-top:8px}
.folder::before{content:"";position:absolute;left:0;top:0;width:20px;height:8px;background:#e8a93a;border-radius:3px 3px 0 0}
.folder::after{content:"";position:absolute;left:0;top:5px;right:0;bottom:0;background:linear-gradient(#ffd56b,#f2b53d);border-radius:2px 4px 4px 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.folder i{position:absolute;z-index:1;left:50%;top:58%;transform:translate(-50%,-50%);font-style:normal;font-size:17px}
/* 창 */
.win{position:absolute;background:#f3f3f3;border:1px solid rgba(0,0,0,.25);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;min-width:320px;min-height:200px;z-index:5}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.min{display:none}
.tbar{height:34px;display:flex;align-items:center;background:#e9eef6;padding-left:10px;font-size:12px;gap:8px;flex:none}
.win.active .tbar{background:#dde7f6}
.tbar .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar button{width:44px;height:34px;border:none;background:transparent;font-size:14px;cursor:pointer;font-family:inherit}
.tbar button:hover{background:rgba(0,0,0,.08)}.tbar button.x:hover{background:#e81123;color:#fff}
.tbar .tab{width:auto;padding:0 10px;font-size:11px;color:#2456b8}
.addr{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid #ddd;font-size:12px;flex:none}
.addr .nav{border:none;background:none;font-size:14px;width:26px;height:24px;border-radius:4px;cursor:pointer;color:#555}
.addr .nav:hover{background:#eee}.addr .nav:disabled{color:#bbb;cursor:default;background:none}
.addr .path{flex:1;border:1px solid #d6d6d6;border-radius:4px;padding:4px 8px;color:#333}
.addr .path span{cursor:pointer}.addr .path span:hover{text-decoration:underline}
.body{flex:1;display:flex;min-height:0;background:#fff}
.side{width:170px;border-right:1px solid #e3e3e3;padding:8px 4px;font-size:12px;overflow:auto;flex:none;background:#fafafa}
.side div{padding:5px 8px;border-radius:4px;cursor:pointer;white-space:nowrap}.side div:hover{background:#e8eef8}.side div.on{background:#cfe0fb}
.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;align-content:start}
.item{padding:8px 4px;text-align:center;font-size:12px;border-radius:4px;border:1px solid transparent;cursor:default;line-height:1.3}
.item:hover{background:#e8f0fd;border-color:#cbdcf7}.item.sel{background:#cce0ff;border-color:#99c1f7}
.item .pic{font-size:38px;height:52px;line-height:52px}
.item small{display:block;color:#888;font-size:10px;margin-top:2px}
.status{height:24px;font-size:11px;color:#555;padding:4px 10px;border-top:1px solid #e3e3e3;background:#fafafa;flex:none}
.frame{flex:1;border:none;width:100%;background:#000}
.grip{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
/* 작업표시줄 */
#bar{position:fixed;left:0;right:0;bottom:0;height:48px;background:rgba(232,238,248,.82);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:4px;z-index:50}
#bar .tb{height:40px;min-width:40px;padding:0 8px;border-radius:6px;border:none;background:transparent;display:flex;align-items:center;gap:6px;font-size:20px;cursor:pointer;position:relative;font-family:inherit}
#bar .tb:hover{background:rgba(255,255,255,.7)}
#bar .tb.open::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:#888}
#bar .tb.on::after{width:16px;background:#2563eb}
#bar .tb span{font-size:12px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{position:absolute;right:12px;font-size:11px;text-align:right;line-height:1.35}
.winlogo{display:grid;grid-template-columns:9px 9px;gap:2px}.winlogo i{width:9px;height:9px;background:#2563eb;border-radius:1px}
/* 시작 메뉴 */
#start{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);width:560px;max-width:96vw;max-height:70vh;background:rgba(243,246,251,.96);backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,.12);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:20px 24px;display:none;z-index:60;overflow:auto}
#start h4{font-size:13px;margin:4px 0 10px}
#start input{width:100%;padding:8px 12px;border-radius:18px;border:1px solid #ccd;font-size:13px;margin-bottom:14px;font-family:inherit;background:#fff}
#start .grid{padding:0;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
#start .foot{margin-top:14px;font-size:11px;color:#667;display:flex;justify-content:space-between;align-items:center}
#start .foot a{color:#2456b8}
#ctx{position:fixed;background:#f9f9f9;border:1px solid #ccc;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px;font-size:12px;display:none;z-index:70;min-width:170px}
#ctx div{padding:6px 12px;border-radius:4px;cursor:pointer}#ctx div:hover{background:#e5eefc}
#toast{position:fixed;right:14px;bottom:62px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:12px 16px;font-size:12px;max-width:300px;display:none;z-index:80}
#toast .tt{display:block;font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
<div id="desk"><div id="icons"></div></div>
<div id="bar">
  <button class="tb" id="startbtn" title="시작"><div class="winlogo"><i></i><i></i><i></i><i></i></div></button>
  <button class="tb" id="explorerbtn" title="파일 탐색기">📁</button>
  <span id="tasks" style="display:flex;gap:4px"></span>
  <div id="clock"></div>
</div>
<div id="start">
  <input id="search" placeholder="🔍  게임 검색" autocomplete="off">
  <h4>모든 게임</h4>
  <div class="grid" id="startgrid"></div>
  <div class="foot"><span>👤 iden1112 · 게임 <b id="gcount"></b>개</span><a href="https://github.com/iden1112/claude-game-tools" target="_blank" rel="noopener">GitHub 저장소 열기 ↗</a></div>
</div>
<div id="ctx"></div>
<div id="toast"></div>
<script>
// ================= 게임 목록 (폴더 = 분류) =================
const FOLDERS = [
  { id: 'shooting', name: '슈팅·액션', emoji: '🎯' },
  { id: 'racing', name: '레이싱·비행', emoji: '🏎️' },
  { id: 'fishing', name: '낚시', emoji: '🎣' },
  { id: 'healing', name: '힐링·키우기', emoji: '🌱' },
  { id: 'minigame', name: '미니게임', emoji: '🎲' },
  { id: 'tools', name: '도구·미리보기', emoji: '🧰' },
];
const GAMES = [
  { f: 'shooting', id: 'training-1v1', name: '훈련장 1v1', emoji: '🔫', desc: '배그 스타일 1대1·팀전·AI 대전·사격 훈련장 (친구와 온라인)', pc: true },
  { f: 'shooting', id: 'sky-front', name: '하늘 전선', emoji: '✈️', desc: '3D 공중전' },
  { f: 'racing', id: 'infinite-drive', name: '무한 드라이브', emoji: '🚗', desc: '끝없는 월드를 달리는 3D 자동차 게임' },
  { f: 'racing', id: 'sky-ring-rush', name: '스카이 링 러시', emoji: '🛩️', desc: '고리를 통과하는 비행 게임' },
  { f: 'fishing', id: 'pixel-fishing-village', name: '픽셀 피싱 빌리지', emoji: '🐟', desc: '스타듀밸리 풍 픽셀 낚시 (최신)' },
  { f: 'fishing', id: 'pixel-fishing-village-v1', name: '픽셀 피싱 빌리지 (이전 버전)', emoji: '🐠', desc: '예전 버전' },
  { f: 'fishing', id: 'sea-fishing', name: '바다낚시', emoji: '🌊', desc: '3D 바다낚시' },
  { f: 'fishing', id: 'boat-upgrade', name: '낚싯배 강화 단계', emoji: '⛵', desc: '낚싯배 강화 단계 모습' },
  { f: 'healing', id: 'whale-farm', name: '고래 등 농장', emoji: '🐋', desc: '고래 등 위에서 농사·낚시' },
  { f: 'healing', id: 'tiny-planet-garden', name: '작은 행성 정원', emoji: '🪐', desc: '작은 행성을 가꾸는 3D 게임' },
  { f: 'minigame', id: 'breath-diver', name: '숨 참기 다이버', emoji: '🤿', desc: '숨을 참고 깊이 내려가는 게임' },
  { f: 'minigame', id: 'ember-smith', name: '잿불 대장장이', emoji: '⚒️', desc: '대장장이 게임' },
  { f: 'minigame', id: 'typing-practice', name: '한글 타자 연습', emoji: '⌨️', desc: '낱말 비 게임 + 자리·낱말·짧은 글·긴 글 연습', pc: true },
  { f: 'tools', id: 'aircraft-preview', name: '비행기 모델 미리보기', emoji: '🛫', desc: 'aircraft3d.js 비행기 모델' },
  { f: 'tools', id: '3d-tools-preview', name: '3D 게임 도구 미리보기', emoji: '🧪', desc: '3D 이펙트·캐릭터·모델 미리보기' },
];
const url = (g) => `games/${g.f}/${g.id}/`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ================= 바탕화면 아이콘 =================
const DESK = [
  { kind: 'pc', name: '내 PC', emoji: '🖥️' },
  ...FOLDERS.map(f => ({ kind: 'folder', id: f.id, name: f.name, emoji: f.emoji })),
  { kind: 'game', id: 'training-1v1', name: '훈련장 1v1', emoji: '🔫' },
  { kind: 'link', name: 'GitHub', emoji: '🐙', href: 'https://github.com/iden1112/claude-game-tools' },
  { kind: 'trash', name: '휴지통', emoji: '🗑️' },
];
function iconPic(d) { return d.kind === 'folder' ? `<span class="folder"><i>${d.emoji}</i></span>` : `<div class="pic">${d.emoji}</div>`; }
function renderDesk() {
  $('icons').innerHTML = DESK.map((d, i) => `<div class="ico" data-i="${i}">${d.kind === 'folder' ? iconPic(d) + '<br>' : iconPic(d)}${esc(d.name)}</div>`).join('');
}
function openDesk(d) {
  if (d.kind === 'folder') openExplorer(d.id);
  else if (d.kind === 'pc') openExplorer(null);
  else if (d.kind === 'game') openGame(GAMES.find(g => g.id === d.id));
  else if (d.kind === 'link') window.open(d.href, '_blank', 'noopener');
  else if (d.kind === 'trash') toast('휴지통', '비어 있어요. 만든 게임은 하나도 버리지 않았어요 😉');
}
$('icons').addEventListener('click', (e) => {
  document.querySelectorAll('.ico.sel').forEach(x => x.classList.remove('sel'));
  const t = e.target.closest('.ico'); if (t) t.classList.add('sel');
});
$('icons').addEventListener('dblclick', (e) => { const t = e.target.closest('.ico'); if (t) openDesk(DESK[+t.dataset.i]); });
// 휴대폰: 한 번 탭으로 열기
$('icons').addEventListener('touchend', (e) => { const t = e.target.closest('.ico'); if (t) { e.preventDefault(); openDesk(DESK[+t.dataset.i]); } });

// ================= 창 관리 =================
let Z = 10, WID = 0;
const WINS = [];
function makeWin(title, icon, w, h) {
  const el = document.createElement('div'); el.className = 'win';
  const n = WINS.length % 6;
  el.style.left = Math.min(innerWidth - w - 10, 120 + n * 28) + 'px'; el.style.top = Math.min(innerHeight - h - 60, 40 + n * 24) + 'px';
  el.style.width = Math.min(w, innerWidth - 10) + 'px'; el.style.height = Math.min(h, innerHeight - 58) + 'px';
  el.innerHTML = `<div class="tbar"><span>${icon}</span><span class="ti">${esc(title)}</span><span class="extra"></span><button class="mn" title="최소화">—</button><button class="mx" title="최대화">☐</button><button class="x" title="닫기">✕</button></div><div class="content" style="flex:1;display:flex;flex-direction:column;min-height:0"></div><div class="grip"></div>`;
  $('desk').appendChild(el);
  const W = { id: ++WID, el, title, icon }; WINS.push(W);
  el.addEventListener('mousedown', () => focus(W));
  el.querySelector('.x').onclick = (e) => { e.stopPropagation(); closeWin(W); };
  el.querySelector('.mn').onclick = (e) => { e.stopPropagation(); el.classList.add('min'); renderTasks(); };
  el.querySelector('.mx').onclick = (e) => { e.stopPropagation(); el.classList.toggle('max'); };
  el.querySelector('.tbar').addEventListener('dblclick', () => el.classList.toggle('max'));
  // 끌어서 옮기기
  const tb = el.querySelector('.tbar');
  tb.addEventListener('mousedown', (e) => {
    if (e.target.closest('button') || el.classList.contains('max')) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    const shield = cover();
    const mv = (ev) => { el.style.left = Math.max(-el.offsetWidth + 80, Math.min(innerWidth - 80, ev.clientX - sx)) + 'px'; el.style.top = Math.max(0, Math.min(innerHeight - 90, ev.clientY - sy)) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); shield.remove(); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  // 크기 바꾸기
  el.querySelector('.grip').addEventListener('mousedown', (e) => {
    e.stopPropagation(); const sx = e.clientX, sy = e.clientY, w0 = el.offsetWidth, h0 = el.offsetHeight; const shield = cover();
    const mv = (ev) => { el.style.width = Math.max(320, w0 + ev.clientX - sx) + 'px'; el.style.height = Math.max(200, h0 + ev.clientY - sy) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); shield.remove(); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  focus(W); renderTasks();
  return W;
}
// 창을 끄는 동안 게임 화면(iframe)이 마우스를 가져가지 않게 덮개
function cover() { const c = document.createElement('div'); c.style.cssText = 'position:fixed;inset:0;z-index:999;cursor:move'; document.body.appendChild(c); return c; }
function focus(W) { WINS.forEach(x => x.el.classList.remove('active')); W.el.classList.add('active'); W.el.style.zIndex = ++Z; W.el.classList.remove('min'); renderTasks(); }
function closeWin(W) { W.el.remove(); WINS.splice(WINS.indexOf(W), 1); renderTasks(); }
function renderTasks() {
  const top = WINS.filter(w => !w.el.classList.contains('min')).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
  $('tasks').innerHTML = WINS.map(w => `<button class="tb open ${w === top ? 'on' : ''}" data-w="${w.id}" title="${esc(w.title)}">${w.icon}<span>${esc(w.title)}</span></button>`).join('');
}
$('tasks').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const W = WINS.find(w => w.id === +b.dataset.w); if (!W) return;
  const top = +W.el.style.zIndex === Z && !W.el.classList.contains('min');
  if (top) { W.el.classList.add('min'); renderTasks(); } else focus(W);
});

// ================= 파일 탐색기 =================
function openExplorer(folder) {
  const W = makeWin('파일 탐색기', '📁', 760, 480);
  const c = W.el.querySelector('.content');
  c.innerHTML = `<div class="addr"><button class="nav back" title="뒤로">←</button><button class="nav up" title="위로">↑</button><div class="path"></div></div>
    <div class="body"><div class="side"></div><div class="grid"></div></div><div class="status"></div>`;
  const hist = []; let cur;
  const show = (f, push = true) => {
    if (push && cur !== undefined) hist.push(cur);
    cur = f;
    const F = FOLDERS.find(x => x.id === f);
    W.el.querySelector('.ti').textContent = F ? F.name : '내 PC';
    c.querySelector('.path').innerHTML = `<span data-f="">🖥️ 내 PC</span> › <span data-f="">게임</span>${F ? ` › <span data-f="${F.id}">${esc(F.name)}</span>` : ''}`;
    c.querySelector('.side').innerHTML = `<div data-f="" class="${!F ? 'on' : ''}">🖥️ 내 PC</div>` + FOLDERS.map(x => `<div data-f="${x.id}" class="${F && F.id === x.id ? 'on' : ''}">📁 ${esc(x.name)}</div>`).join('');
    const g = c.querySelector('.grid');
    if (!F) {
      g.innerHTML = FOLDERS.map(x => `<div class="item" data-f="${x.id}"><span class="folder" style="transform:scale(1.15)"><i>${x.emoji}</i></span><br>${esc(x.name)}<small>${GAMES.filter(y => y.f === x.id).length}개</small></div>`).join('');
      c.querySelector('.status').textContent = `폴더 ${FOLDERS.length}개 · 게임 ${GAMES.length}개`;
    } else {
      const list = GAMES.filter(y => y.f === F.id);
      g.innerHTML = list.map(y => `<div class="item" data-g="${y.id}" title="${esc(y.desc)}"><div class="pic">${y.emoji}</div>${esc(y.name)}<small>${y.pc ? 'PC 전용' : '게임'}</small></div>`).join('');
      c.querySelector('.status').textContent = `항목 ${list.length}개 · 두 번 클릭하면 실행 · 오른쪽 클릭: 새 탭에서 열기`;
    }
    c.querySelector('.back').disabled = !hist.length; c.querySelector('.up').disabled = !F;
  };
  c.addEventListener('click', (e) => {
    const p = e.target.closest('.path span, .side div'); if (p) { show(p.dataset.f || null); return; }
    c.querySelectorAll('.item.sel').forEach(x => x.classList.remove('sel'));
    const it = e.target.closest('.item'); if (it) { it.classList.add('sel'); if (it.dataset.g) c.querySelector('.status').textContent = GAMES.find(y => y.id === it.dataset.g).desc; }
  });
  c.addEventListener('dblclick', (e) => {
    const it = e.target.closest('.item'); if (!it) return;
    if (it.dataset.f) show(it.dataset.f); else openGame(GAMES.find(y => y.id === it.dataset.g));
  });
  c.addEventListener('contextmenu', (e) => { const it = e.target.closest('.item'); if (it && it.dataset.g) { e.preventDefault(); ctxMenu(e, GAMES.find(y => y.id === it.dataset.g)); } });
  c.querySelector('.back').onclick = () => { if (hist.length) show(hist.pop(), false); };
  c.querySelector('.up').onclick = () => show(null);
  show(folder || null, false);
}
$('explorerbtn').onclick = () => openExplorer(null);

// ================= 게임 실행 =================
function openGame(g) {
  if (!g) return;
  // 마우스를 화면에 고정하는 게임(총 게임 등)은 새 탭이 제일 편해요
  if (g.pc) { window.open(url(g), '_blank'); toast(g.name, '새 탭에서 열었어요. (마우스 고정·전체화면이 잘 되도록)'); return; }
  const W = makeWin(g.name, g.emoji, 1000, 640);
  W.el.querySelector('.extra').innerHTML = `<button class="tab" title="새 탭에서 열기">새 탭 ↗</button>`;
  W.el.querySelector('.tab').onclick = () => window.open(url(g), '_blank');
  const c = W.el.querySelector('.content');
  c.innerHTML = `<iframe class="frame" src="${url(g)}" allow="fullscreen; pointer-lock; gamepad; autoplay" allowfullscreen></iframe>`;
}
function ctxMenu(e, g) {
  const m = $('ctx');
  m.innerHTML = `<div data-a="open">▶ 열기</div><div data-a="tab">↗ 새 탭에서 열기</div><div data-a="copy">🔗 주소 복사</div><div data-a="info">ℹ️ 속성</div>`;
  m.style.left = Math.min(e.clientX, innerWidth - 180) + 'px'; m.style.top = Math.min(e.clientY, innerHeight - 160) + 'px'; m.style.display = 'block';
  m.onclick = (ev) => {
    const a = ev.target.dataset.a; m.style.display = 'none';
    const full = new URL(url(g), location.href).href;
    if (a === 'open') openGame(g);
    if (a === 'tab') window.open(url(g), '_blank');
    if (a === 'copy') { try { navigator.clipboard.writeText(full); toast('주소 복사', full); } catch (err) { toast('주소', full); } }
    if (a === 'info') toast(g.name, `${g.desc}<br><small>${esc(full)}</small>`);
  };
}
addEventListener('click', (e) => { if (!e.target.closest('#ctx')) $('ctx').style.display = 'none'; if (!e.target.closest('#start') && !e.target.closest('#startbtn')) $('start').style.display = 'none'; });
let toastT;
function toast(t, s) { const el = $('toast'); el.innerHTML = `<span class="tt">${esc(t)}</span>${s}`; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 4000); }

// ================= 시작 메뉴 =================
function renderStart(q = '') {
  q = q.trim().toLowerCase();
  const list = GAMES.filter(g => !q || (g.name + g.desc).toLowerCase().includes(q));
  $('startgrid').innerHTML = list.map(g => `<div class="item" data-g="${g.id}" title="${esc(g.desc)}"><div class="pic">${g.emoji}</div>${esc(g.name)}<small>${esc(FOLDERS.find(f => f.id === g.f).name)}</small></div>`).join('') || '<div style="color:#888;font-size:12px">찾는 게임이 없어요</div>';
  $('gcount').textContent = GAMES.length;
}
$('startbtn').onclick = () => { const s = $('start'); const on = s.style.display === 'block'; s.style.display = on ? 'none' : 'block'; if (!on) { renderStart(); $('search').value = ''; setTimeout(() => $('search').focus(), 30); } };
$('search').addEventListener('input', (e) => renderStart(e.target.value));
$('startgrid').addEventListener('click', (e) => { const it = e.target.closest('.item'); if (it) { $('start').style.display = 'none'; openGame(GAMES.find(g => g.id === it.dataset.g)); } });
addEventListener('keydown', (e) => { if (e.key === 'Meta' || (e.key === 'Escape' && $('start').style.display === 'block')) $('startbtn').click(); });

// ================= 시계 =================
function tick() { const d = new Date(); $('clock').innerHTML = `${d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' })}<br>${d.toLocaleDateString('ko-KR')}`; }
tick(); setInterval(tick, 10000);
renderDesk();
setTimeout(() => toast('환영해요 👋', '폴더를 <b>두 번 클릭</b>하면 게임이 나와요. 아래 ⊞ 시작 버튼에서 검색도 돼요.'), 600);
</script>
